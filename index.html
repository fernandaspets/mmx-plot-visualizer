<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MMX PoSpace Plot — Reference Spec</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#c0c8d8;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}
.bar{position:fixed;top:0;left:0;right:0;height:40px;background:#080d18;z-index:100;
display:flex;align-items:center;justify-content:space-between;padding:0 14px;
border-bottom:1px solid #152040}
.bar .t{font-size:14px;font-weight:700;color:#2898b8;letter-spacing:.5px}
.bar .b{display:flex;gap:4px}
.btn{background:#0e1830;color:#407090;border:1px solid #182848;padding:4px 10px;
border-radius:3px;cursor:pointer;font-size:11px;transition:all .12s}
.btn:hover{background:#182848;color:#68a0c0}
.btn.on{background:#084060;color:#fff;border-color:#086090}
#view{margin-top:40px;padding:20px;min-height:calc(100vh - 40px)}
svg{display:block;margin:0 auto;max-width:100%;height:auto}
.step-nav{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.step-nav .dot{width:28px;height:6px;background:#152040;border-radius:2px;cursor:pointer;transition:all .2s}
.step-nav .dot:hover{background:#284868}
.step-nav .dot.on{background:#086090}
.step-nav .dot.done{background:#183048}
.info{max-width:560px;margin:12px auto;padding:14px;background:#0c1018;
border:1px solid #182848;border-radius:6px;font-size:13px;line-height:1.6}
.info h2{color:#2898b8;font-size:15px;margin-bottom:4px}
.info h3{color:#407090;font-size:13px;margin-top:8px;margin-bottom:2px}
.info .d{color:#8890a0}
.info .s{color:#b0a020;font-family:monospace;font-size:11px}
.info .c{background:#060a14;border:1px solid #0a1428;border-radius:3px;padding:6px;
font-family:monospace;font-size:10px;color:#2090b0;margin:4px 0;white-space:pre-wrap;word-break:break-all}
.info .k{color:#20b898;font-weight:600;margin:5px 0;padding:5px;background:#08120c;
border-radius:3px;border:1px solid #0a2028}
.ani{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes flowDash{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes highlight{0%,100%{opacity:.2}50%{opacity:.9}}
@keyframes growLine{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.flow-line{stroke-dasharray:8 4;animation:flowDash 1s linear infinite}
.pulse-ani{animation:pulse 2s ease infinite}
.highlight-ani{animation:highlight 1.5s ease infinite}
.grow-ani{animation:growLine 1.5s ease forwards}
.lbl{font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;fill:#687888}
.lbl-b{font-weight:600;font-size:12px}
.lbl-mono{font-family:monospace;font-size:10px;fill:#b0a020}
.lbl-val{font-family:monospace;font-size:10px;fill:#2090b0}
.lbl-key{font-weight:700;font-size:11px;fill:#20b898}
</style>
</head>
<body>
<div class="bar"><div class="t">MMX PoSpace Plot — Reference Spec</div>
<div class="b">
<button class="btn" id="bp">◀ Prev</button>
<button class="btn on" id="bpl">▶ Auto</button>
<button class="btn" id="bn">Next ▶</button>
<button class="btn" id="br">↻ Reset</button>
</div></div>
<div id="view"></div>
<div class="step-nav" id="nav"></div>
<div class="info" id="info"></div>

<script>
// ===== DATA =====
const KSIZE=29,LOGBUCKETS=8,N_TABLE=9,N_META=14,N_META_OUT=12;
const NUM_BUCKETS=256;
const park_size_y=8192,park_size_pd=2048,park_size_x=2048;
const entries={1:536870912,2:536872741,3:536850867,4:536853641,5:536829092,
  6:536768040,7:536659701,8:536458310,9:536061737};

const COLORS={Y:'#44ddff',META:'#ffaa44',PD:'#aa44ff',X:'#44ff88',F1:'#ff4466',
  HDR:'#888899',DISK:'#666688',STREAM:'#ffee44',EDGE:'#2a3858',FLOW:'#ffdd44',
  BG:'#0a0e1a',PANEL:'#0c1018',TEXT:'#687888',KEY:'#20b898'};

// ===== SVG HELPERS =====
function svgEl(tag,attrs={}){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e;}

function rect(x,y,w,h,fill,opacity=1,stroke=null,sw=1,rx=0){
  return svgEl('rect',{x,y,width:w,height:h,fill,opacity:opacity<1?opacity:undefined:1,
    stroke:stroke||'none','stroke-width':sw,rx:rx||0});
}
function text(x,y,str,fill='#687888',size=11,weight='normal',anchor='start',mono=false){
  const t=svgEl('text',{x,y,fill,'font-size':size,'font-weight':weight,'text-anchor':anchor,
    'font-family':mono?'monospace':'Segoe UI,system-ui,sans-serif'});
  t.textContent=str;return t;
}
function line(x1,y1,x2,y2,stroke='#2a3858',sw=1,opacity=1,dash=null,cssClass=null){
  const l=svgEl('line',{x1,y1,x2,y2,stroke,'stroke-width':sw,opacity:opacity<1?opacity:undefined:1});
  if(dash)l.setAttribute('stroke-dasharray',dash);
  if(cssClass)l.setAttribute('class',cssClass);
  return l;
}
function arrow(x1,y1,x2,y2,stroke='#ffdd44',sw=1.5){
  const g=svgEl('g',{});
  g.appendChild(line(x1,y1,x2,y2,stroke,sw,null,'flow-line'));
  const ang=Math.atan2(y2-y1,x2-x1);
  const ax=x2-Math.cos(ang)*8,ay=y2-Math.sin(ang)*8;
  g.appendChild(line(x2,y2,ax+Math.cos(ang+Math.PI/2)*4,ay+Math.sin(ang+Math.PI/2)*4,stroke,sw));
  g.appendChild(line(x2,y2,ax-Math.cos(ang+Math.PI/2)*4,ay-Math.sin(ang+Math.PI/2)*4,stroke,sw));
  return g;
}
function circle(cx,cy,r,fill='#44ddff',opacity=1,stroke=null,sw=1){
  return svgEl('circle',{cx,cy,r,fill,opacity:opacity<1?opacity:undefined:1,
    stroke:stroke||'none','stroke-width':sw});
}

// ===== SCENE BUILDERS =====
const scenes=[];

// --- Scene 1: Plot File ---
scenes.push({
name:'Plot File',
desc:'14.6 GB binary file. 79% back-pointers, 20% X values, 1% Y table.',
build(){
  const W=900,H=300;
  const s=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  // Title
  s.appendChild(text(W/2,30,'14.6 GB Plot File (k=29, SSD)',COLORS.KEY,16,'bold','middle'));
  // File bar
  const barY=80,barH=50,barW=840,barX=30;
  const secs=[
    {n:'Y table',sz:0.008,c:COLORS.Y,lbl:'144 MB'},
    {n:'PD[0]\nT9→T8',sz:0.113,c:COLORS.PD,lbl:'2.0 GB'},
    {n:'PD[1]\nT8→T7',sz:0.113,c:COLORS.PD,lbl:'2.0 GB'},
    {n:'PD[2]\nT7→T6',sz:0.113,c:COLORS.PD,lbl:'2.0 GB'},
    {n:'PD[3]\nT6→T5',sz:0.113,c:COLORS.PD,lbl:'2.0 GB'},
    {n:'PD[4]\nT5→T4',sz:0.113,c:COLORS.PD,lbl:'2.0 GB'},
    {n:'PD[5]\nT4→T3',sz:0.113,c:COLORS.PD,lbl:'2.0 GB'},
    {n:'PD[6]\nT3→T2',sz:0.113,c:COLORS.PD,lbl:'2.0 GB'},
    {n:'X table',sz:0.203,c:COLORS.X,lbl:'3.6 GB'},
  ];
  let x=barX;
  secs.forEach((sec,i)=>{
    const w=sec.sz*barW;if(w<2)return;
    const r=rect(x,barY,w,barH,sec.c,0.85,COLORS.EDGE,1,3);
    r.setAttribute('class','pulse-ani');r.style.animationDelay=(i*0.15)+'s';
    s.appendChild(r);
    if(w>20){s.appendChild(text(x+w/2,barY-6,sec.n.split('\n')[0],sec.c,10,'bold','middle'));
      s.appendChild(text(x+w/2,barY+barH+14,sec.lbl,COLORS.TEXT,9,'normal','middle'));}
    x+=w;
  });
  // Header marker
  s.appendChild(rect(28,barY,4,barH,COLORS.HDR,0.8));
  s.appendChild(text(30,barY-6,'Hdr',COLORS.HDR,9,'bold','middle'));
  // File boundary
  s.appendChild(rect(barX-2,barY-2,barW+4,barH+4,'none',1,COLORS.HDR,2,4));
  // Legend
  s.appendChild(text(W/2,180,'What each section stores:',COLORS.TEXT,12,'bold','middle'));
  s.appendChild(text(W/2,205,'Y table = sorted Y values of table 9 (for fast challenge lookup)',COLORS.Y,11,'normal','middle'));
  s.appendChild(text(W/2,225,'PD[0-6] = back-pointers: each section maps one table to its parents (binary tree branches)',COLORS.PD,11,'normal','middle'));
  s.appendChild(text(W/2,245,'X table = original X values of table 2 (the tree leaves / proof output)',COLORS.X,11,'normal','middle'));
  // Key insight
  s.appendChild(rect(100,265,700,28,COLORS.KEY,0.08,COLORS.KEY,1,4));
  s.appendChild(text(W/2,282,'KEY: PD parks are 79% of the file — they store the binary tree back-pointers for all 536M trees',COLORS.KEY,12,'bold','middle'));
  return s;
},
info:{t:'The Plot File',d:'A single binary file that proves you spent compute time.',
body:`<h3>Analogy</h3><div class="d">Solve 536M puzzles, write answers in a file. Later, someone challenges you: look up the answer in seconds instead of re-solving.</div>
<h3>Sections (left → right in the file)</h3>
<div class="s">Header — 4 KB: ksize, seed, plot_id, farmer_key, park sizes, all offsets</div>
<div class="s">Y table — 144 MB (1%): sorted Y values of table 9, delta-encoded parks</div>
<div class="s">PD[0-6] — 7 × 2.0 GB (79%): back-pointers for tables 9→8, 8→7, ..., 3→2</div>
<div class="s">X table — 3.6 GB (20%): X values of table 2, packed as 57-bit line points</div>
<div class="k">PD parks are 79% of the file. They store back-pointers for ALL 536M binary trees.</div>
<div class="s">park_size_y=8192, park_size_pd=2048, park_size_x=2048</div>
<div class="s">Park byte sizes: Y≈2308B, PD≈8103B, X≈14592B</div>`}
});

// --- Scene 2: F1 Table 1 ---
scenes.push({
name:'F1: Table 1',
desc:'Memory-hard PoW: each X generates 4KB memory, 256-iter random access, then SHA512.',
build(){
  const W=900,H=340;
  const s=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  s.appendChild(text(W/2,25,'Table 1 (F1): Memory-Hard Proof of Work',COLORS.KEY,15,'bold','middle'));
  // X input
  s.appendChild(rect(50,130,70,40,COLORS.X,0.8,COLORS.EDGE,1,4));
  s.appendChild(text(85,155,'X',COLORS.X,14,'bold','middle'));
  s.appendChild(text(85,185,'input',COLORS.TEXT,10,'normal','middle'));
  // Arrow to memory grid
  s.appendChild(arrow(120,150,180,150,COLORS.FLOW));
  // Memory grid (8x8)
  const gx=190,gy=100,sz=14;
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const c=rect(gx+i*sz,gy+j*sz,sz-1,sz-1,COLORS.F1,0.2+Math.random()*0.3,COLORS.EDGE,0.5,1);
    c.setAttribute('class','pulse-ani');c.style.animationDelay=(i+j)*0.05+'s';
    s.appendChild(c);
  }
  s.appendChild(text(gx+56,gy-8,'4KB memory',COLORS.F1,11,'bold','middle'));
  s.appendChild(text(gx+56,gy+130,'1024 uint32',COLORS.TEXT,9,'normal','middle'));
  s.appendChild(text(gx+56,gy+145,'32 rounds hash',COLORS.TEXT,9,'normal','middle'));
  // Random access arcs
  for(let i=0;i<5;i++){
    const x1=gx+Math.random()*110,y1=gy+Math.random()*110;
    const x2=gx+Math.random()*110,y2=gy+Math.random()*110;
    s.appendChild(line(x1,y1,x2,y2,'#ff6688',1,0.3,'2 2','flow-line'));
  }
  s.appendChild(text(gx+56,gy+165,'256-iter random access',COLORS.F1,9,'normal','middle'));
  // Arrow to SHA512
  s.appendChild(arrow(320,150,380,150,COLORS.FLOW));
  // SHA512 box
  s.appendChild(rect(380,125,80,50,COLORS.F1,0.7,COLORS.EDGE,1,4));
  s.appendChild(text(420,155,'SHA512',COLORS.F1,13,'bold','middle'));
  s.appendChild(text(420,190,'key ‖ mem_hash',COLORS.TEXT,9,'normal','middle'));
  // Arrow to output
  s.appendChild(arrow(460,150,530,150,COLORS.FLOW));
  // Output: Y + C + X
  s.appendChild(rect(530,100,55,30,COLORS.Y,0.8,COLORS.EDGE,1,3));
  s.appendChild(text(557,120,'Y',COLORS.Y,12,'bold','middle'));
  s.appendChild(text(557,148,'29-bit',COLORS.TEXT,9,'normal','middle'));
  s.appendChild(rect(530,135,55,30,COLORS.META,0.7,COLORS.EDGE,1,3));
  s.appendChild(text(557,155,'C (meta)',COLORS.META,10,'bold','middle'));
  s.appendChild(text(557,183,'14×29-bit',COLORS.TEXT,9,'normal','middle'));
  s.appendChild(rect(530,170,55,30,COLORS.X,0.8,COLORS.EDGE,1,3));
  s.appendChild(text(557,190,'X',COLORS.X,12,'bold','middle'));
  s.appendChild(text(557,218,'29-bit',COLORS.TEXT,9,'normal','middle'));
  // Stats
  s.appendChild(rect(620,80,260,120,COLORS.PANEL,0.6,COLORS.EDGE,1,4));
  s.appendChild(text(630,100,'Cost:',COLORS.TEXT,11,'bold'));
  s.appendChild(text(630,118,'2²⁹ × 4KB = 2 TB writes',COLORS.META,11,'normal','monospace'));
  s.appendChild(text(630,136,'~9.4 sec on RTX 5090',COLORS.X,11,'normal','monospace'));
  s.appendChild(text(630,154,'(compute-bound)',COLORS.TEXT,10,'normal'));
  s.appendChild(text(630,178,'Verification:',COLORS.TEXT,11,'bold'));
  s.appendChild(text(630,196,'Only 256 X values need F1',COLORS.Y,10,'normal','monospace'));
  s.appendChild(text(630,212,'= milliseconds',COLORS.Y,10,'normal','monospace'));
  return s;
},
info:{t:'F1: Table 1',d:'Memory-hard proof-of-work. The "work" that proves you spent time.',
body:`<h3>Per X value (0 to 536,870,911):</h3>
<div class="d">1. key = SHA512(X ‖ plot_id) — 16 uint32</div>
<div class="d">2. Generate 4KB memory: 32 rounds of hashing → 1024 uint32</div>
<div class="d">3. 256 iterations of random access into that 4KB</div>
<div class="d">4. SHA512(key ‖ mem_hash) → Y (29-bit) + C (14×29-bit meta)</div>
<div class="c">Y = XOR(SHA512(key ‖ mem_hash)[0..13]) &amp; KMASK
C[j*14+i] = hash[i] &amp; KMASK
X[j] = X  (stored for proof)</div>
<div class="s">Cost: 2^29 × 4KB = 2TB writes. ~9.4s on RTX 5090 (compute-bound).</div>
<div class="s">Verification: only 256 X values need F1 recompute = milliseconds.</div>
<div class="k">F1 is the PoW component. The memory-hard random access cannot be parallelized efficiently.</div>`}
});

// --- Scene 3: Match + Eval ---
scenes.push({
name:'Match + Eval',
desc:'Find (Y, Y+1) pair → SHA512(meta_L‖meta_R) → new entry with PD back-pointer.',
build(){
  const W=900,H=380;
  const s=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  s.appendChild(text(W/2,25,'Match + Eval: The Core Operation',COLORS.KEY,15,'bold','middle'));
  // Left: two entries with consecutive Y
  s.appendChild(rect(60,80,120,40,COLORS.Y,0.8,COLORS.EDGE,1,4));
  s.appendChild(text(120,105,'Y',COLORS.Y,14,'bold','middle'));
  s.appendChild(rect(60,130,120,40,COLORS.Y,0.8,COLORS.EDGE,1,4));
  s.appendChild(text(120,155,'Y+1',COLORS.Y,14,'bold','middle'));
  s.appendChild(text(120,190,'consecutive pair',COLORS.FLOW,10,'bold','middle'));
  // Meta boxes
  s.appendChild(rect(60,80,30,40,COLORS.META,0.6,COLORS.EDGE,1,2));
  s.appendChild(rect(60,130,30,40,COLORS.META,0.6,COLORS.EDGE,1,2));
  // Arrow to SHA512
  s.appendChild(arrow(180,125,300,125,COLORS.FLOW));
  s.appendChild(text(240,118,'meta_L ‖ meta_R',COLORS.META,10,'normal','middle'));
  // SHA512 box
  s.appendChild(rect(300,100,90,50,COLORS.F1,0.7,COLORS.EDGE,1,4));
  s.appendChild(text(345,130,'SHA512',COLORS.F1,14,'bold','middle'));
  // Arrow to output
  s.appendChild(arrow(390,125,480,125,COLORS.FLOW));
  // Output: new entry
  s.appendChild(rect(480,80,80,35,COLORS.Y,0.8,COLORS.EDGE,1,4));
  s.appendChild(text(520,103,'new Y',COLORS.Y,11,'bold','middle'));
  s.appendChild(rect(480,120,80,35,COLORS.META,0.7,COLORS.EDGE,1,4));
  s.appendChild(text(520,143,'new meta',COLORS.META,10,'bold','middle'));
  s.appendChild(rect(480,160,80,35,COLORS.PD,0.8,COLORS.EDGE,1,4));
  s.appendChild(text(520,183,'PD',COLORS.PD,12,'bold','middle'));
  s.appendChild(text(520,213,'back-pointer',COLORS.TEXT,9,'normal','middle'));
  // PD detail box
  s.appendChild(rect(620,80,240,115,COLORS.PANEL,0.6,COLORS.EDGE,1,4));
  s.appendChild(text(630,100,'PD = 40 bits:',COLORS.PD,11,'bold'));
  s.appendChild(text(630,118,'[position: 30 bits][delta: 5 bits]',COLORS.META,10,'normal','monospace'));
  s.appendChild(text(630,138,'position = y_out × max_bs + pos_in',COLORS.TEXT,9,'normal','monospace'));
  s.appendChild(text(630,154,'delta = right_parent - left - 1',COLORS.TEXT,9,'normal','monospace'));
  s.appendChild(text(630,176,'Phase 2 remaps to compact index',COLORS.KEY,9,'bold'));
  // Back-pointer arrow (reverse)
  s.appendChild(arrow(480,180,180,170,COLORS.PD));
  s.appendChild(text(330,172,'← points back to parents',COLORS.PD,10,'normal','middle'));
  // Bottom: repeat 8 times
  s.appendChild(rect(100,250,700,40,COLORS.KEY,0.08,COLORS.KEY,1,4));
  s.appendChild(text(W/2,275,'This operation repeats 8 times: tables 2 through 9',COLORS.KEY,12,'bold','middle'));
  s.appendChild(text(W/2,300,'Each entry in table t has exactly 2 parents in table t-1 → binary tree structure',COLORS.TEXT,11,'normal','middle'));
  s.appendChild(text(W/2,325,'Probability of Y+1 neighbor ≈ 63% → tables stay ~same size (NOT a funnel)',COLORS.TEXT,11,'normal','middle'));
  return s;
},
info:{t:'Match + Eval',d:'The fundamental operation: combine two parents into one child.',
body:`<div class="k">Each entry in tables 2-9 is created by finding two entries with consecutive Y values.</div>
<h3>Step by step</h3>
<div class="d">1. Sort entries by Y value</div>
<div class="d">2. Find a pair where Y and Y+1 are both present</div>
<div class="d">3. SHA512(meta_L ‖ meta_R) → new Y + new meta</div>
<div class="d">4. Store PD back-pointer to find parents later</div>
<div class="c">block = meta_L ‖ meta_R    // 2×14×29 = 812 bits
hash = SHA512(block)
Y_new = XOR(hash[0..13]) &amp; KMASK
PD = (left_parent_index &lt;&lt; 5) | delta</div>
<h3>PD Encoding (raw, phase 1)</h3>
<div class="s">PD = 40 bits: [position:30 bits][delta:5 bits]</div>
<div class="s">position = y_output × max_bucket_size + global_pos_input</div>
<div class="s">delta = distance from left to right parent</div>
<div class="s">Phase 2 remaps positions to compact (dense) indices before park encoding</div>
<h3>Why Y and Y+1?</h3>
<div class="d">Y values are random in 2^29 space. P(Y+1 neighbor) ≈ 63%. Each entry matches ~2 partners (as left AND right parent), so tables stay ~same size.</div>`}
});

// --- Scene 4: All 9 Tables ---
scenes.push({
name:'Tables 1-9',
desc:'9 tables, each ~536M entries. NOT a funnel — sizes barely change.',
build(){
  const W=900,H=340;
  const s=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  s.appendChild(text(W/2,25,'The 9 Tables: A Forest of 536M Binary Trees',COLORS.KEY,15,'bold','middle'));
  const tD=[
    {n:'T1 (F1)',c:COLORS.F1,sub:'X → hash → Y, meta',e:entries[1]},
    {n:'T2',c:COLORS.X,sub:'stores X values',e:entries[2]},
    {n:'T3',c:COLORS.PD,sub:'Y, meta, PD',e:entries[3]},
    {n:'T4',c:COLORS.PD,sub:'Y, meta, PD',e:entries[4]},
    {n:'T5',c:COLORS.PD,sub:'Y, meta, PD',e:entries[5]},
    {n:'T6',c:COLORS.PD,sub:'Y, meta, PD',e:entries[6]},
    {n:'T7',c:COLORS.PD,sub:'Y, meta, PD',e:entries[7]},
    {n:'T8',c:COLORS.PD,sub:'Y, meta, PD',e:entries[8]},
    {n:'T9',c:COLORS.Y,sub:'Y-sorted, final',e:entries[9]},
  ];
  const bw=70,bh=28,sp=12,x0=80,y0=60;
  tD.forEach((t,i)=>{
    const x=x0+i*(bw+sp),y=y0+60;
    const r=rect(x,y,bw,bh,t.c,0.7,COLORS.EDGE,1,3);
    r.setAttribute('class','pulse-ani');r.style.animationDelay=(i*0.1)+'s';
    s.appendChild(r);
    s.appendChild(text(x+bw/2,y+18,t.n,t.c,10,'bold','middle'));
    s.appendChild(text(x+bw/2,y+bh+12,t.sub,COLORS.TEXT,8,'normal','middle'));
    s.appendChild(text(x+bw/2,y+bh+26,(t.e/1e6).toFixed(1)+'M',COLORS.META,9,'bold','middle'));
    if(i<8)s.appendChild(arrow(x+bw+2,y+bh/2,x+bw+sp-2,y+bh/2,COLORS.FLOW));
  });
  // Key insight
  s.appendChild(rect(80,200,740,50,COLORS.KEY,0.08,COLORS.KEY,1,4));
  s.appendChild(text(W/2,220,'All tables ~536M entries — NOT a funnel',COLORS.KEY,13,'bold','middle'));
  s.appendChild(text(W/2,240,'Each entry matches ~2 partners (as left AND right parent), so table sizes barely change',COLORS.TEXT,11,'normal','middle'));
  // Stats
  s.appendChild(text(120,280,'T1: 536,870,912',COLORS.F1,10,'normal'));

info:{t:'Phase 2: Park Encoding',d:'Convert raw RAM buckets to compressed park format, write to disk.',
body:`<div class="k">Phase 2 has TWO passes per table. It remaps positions to compact indices, then encodes parks.</div>
<h3>Pass 1: Compaction</h3>
<div class="d">1. mark_used: build bitfield of which positions are referenced</div>
<div class="d">2. count_used: count set bits per group</div>
<div class="d">3. remap_pd: replace sparse positions with dense compact indices</div>
<div class="s">Raw PD: position = y × max_bucket_size + global_pos (sparse, 30-bit)</div>
<div class="s">Compact PD: position = sequential index (dense, 29-bit, no gaps)</div>
<h3>Pass 2: Encoding</h3>
<div class="d">1. Sort entries by Y (within bucket)</div>
<div class="d">2. Delta-encode: store first value, then differences</div>
<div class="d">3. ANS-encode deltas into compact bit stream</div>
<div class="d">4. Write park to file: [first value][delta bit stream]</div>
<h3>Park Types</h3>
<div class="s">Y park: [4B first Y][8191 deltas @ ~2.25 bits each] ≈ 2308 bytes</div>
<div class="s">PD park: [2048×29-bit positions][delta stream @ ~2.65 bits] ≈ 8103 bytes</div>
<div class="s">X park: [2048×57-bit line points] ≈ 14592 bytes</div>
<div class="k">Phase 2 time: ~5-7s. Writes 14.6 GB to disk.</div>`}

// --- Scene 7: Binary Tree ---
scenes.push({
name:'Binary Tree',
desc:'1 root at T9 → 2→4→...→256 leaves. Perfect depth-8 binary tree per proof.',
build(){
  const W=900,H=360;
  const s=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  s.appendChild(text(W/2,25,'Proof = Binary Tree Walk (depth 8)',COLORS.KEY,15,'bold','middle'));
  const cx=450,levels=9;
  for(let k=0;k<levels;k++){
    const count=Math.min(1<<k,64); // cap visual
    const y=50+k*38;
    const spread=Math.min(W-100,800/Math.max(1,1<<Math.min(k,6)));
    for(let i=0;i<count;i++){
      const x=cx-count*spread/2+i*spread+spread/2;
      const c=k===0?COLORS.Y:k===levels-1?COLORS.X:COLORS.PD;
      const r=circle(x,y,Math.max(2.5,6-k*0.5),c,0.8,COLORS.EDGE,0.5);
      r.setAttribute('class','pulse-ani');r.style.animationDelay=(k*0.15+i*0.02)+'s';
      s.appendChild(r);
      // Edges to children
      if(k<levels-1){
        const childCount=Math.min(count*2,64);
        const childSpread=Math.min(W-100,800/Math.max(1,1<<Math.min(k+1,6)));
        const childY=50+(k+1)*38;
        for(let c2=2*i;c2<2*i+2;c2++){
          if(c2<childCount){
            const cx2=cx-childCount*childSpread/2+c2*childSpread+childSpread/2;
            s.appendChild(line(x,y,cx2,childY,COLORS.EDGE,0.5,0.2));
          }
        }
      }
    }
    // Level label
    s.appendChild(text(50,y+4,k===0?'T9 (1 root)':k===levels-1?'T1 (256 X)':'T'+(9-k),COLORS.TEXT,10,'bold'));
    s.appendChild(text(850,y+4,Math.min(1<<k,256)+' entries',COLORS.META,9,'bold','middle'));
  }
  s.appendChild(rect(100,400,700,28,COLORS.KEY,0.08,COLORS.KEY,1,4));
  s.appendChild(text(W/2,418,'Each PD read gives 2 parent pointers. 7 doublings: 1 → 2 → 4 → 8 → 16 → 32 → 64 → 128 → 256',COLORS.KEY,11,'bold','middle'));
  return s;
},
info:{t:'Proof = Binary Tree',d:'A proof is a binary tree walk: from 1 root to 256 X value leaves.',
body:`<div class="k">Every proof is a perfect binary tree of depth 8. One root, 256 leaves.</div>
<h3>The Walk</h3>
<div class="s">Table 9 → 1 entry (root, the Y match)</div>
<div class="s">Table 8 → 2 entries (root's parents)</div>
<div class="s">Table 7 → 4 entries</div>
<div class="s">...doubling each level...</div>
<div class="s">Table 2 → 128 entries, each has 2 X values</div>
<div class="s">Table 1 → 256 X values (leaves)</div>
<div class="c">pointers = [root_index]      // 1 entry
for t in 9→2:               // 7 steps
  new = []
  for idx in pointers:         // doubles
    PD = read_park(t, idx)
    left  = PD >> 5            // parent 1
    right = left + (PD & 31) + 1
    new += [left, right]
  pointers = new               // 2x each step
// 128 pointers → read X park → 256 X values</div>
<div class="s">Proof = 256 uint32 X values ≈ 1 KB</div>
<div class="k">The plot file stores back-pointers for ALL 536M trees. That is why PD is 79% of the file.</div>`}
});

info:{t:'Proof Lookup (Farming)',d:'How the file is read to answer a challenge.',
body:`<div class="k">Farming = reading the file to find proofs. Three steps, all fast.</div>
<h3>Step 1: Scan Y table</h3>
<div class="d">challenge → Y_begin = SHA256("plot_challenge"‖plot_id‖challenge) &amp; KMASK</div>
<div class="d">Scan Y parks for entries in [Y_begin, Y_begin+16)</div>
<div class="s">Y is sorted → binary search. Each hit = 1 tree root.</div>
<h3>Step 2: Walk PD parks</h3>
<div class="d">For each Y match, read PD parks from table 9 down to table 2:</div>
<div class="s">PD[0]: T9→T8 → 2 pointers (read compact position + delta)</div>
<div class="s">PD[1]: T8→T7 → 4 pointers</div>
<div class="s">...7 parks, doubling each time...</div>
<div class="s">PD[6]: T3→T2 → 128 pointers</div>
<h3>Step 3: Read X park</h3>
<div class="d">128 table-2 indices → read X park → 256 X values</div>
<div class="s">X park stores line points: 57 bits each → split into (X1, X2)</div>
<h3>The asymmetry</h3>
<div class="k">Lookup = O(parks read) = milliseconds. Plotting = O(536M) = 42 seconds.</div>
<div class="s">Verification: recompute tree from 256 X values → 1 Y. O(256) = milliseconds.</div>`}
});

// ===== RENDER ENGINE =====
let cur=0,playing=true,stTimer=0,stDur=10;
const view=document.getElementById('view');
const infoEl=document.getElementById('info');
const navEl=document.getElementById('nav');

// Build nav dots
scenes.forEach((s,i)=>{
  const d=document.createElement('div');d.className='dot';d.title=s.name;
  d.onclick=()=>{show(i);playing=false;updatePlayBtn();};
  navEl.appendChild(d);
});

function show(i){
  cur=i;const sc=scenes[i];
  // Render SVG
  view.innerHTML='<div class="ani">'+sc.build().outerHTML+'</div>';
  // Info
  const inf=sc.info;
  infoEl.innerHTML=`<div class="ani"><h2>${inf.t}</h2><div class="d">${inf.d}</div>${inf.body}</div>`;
  // Nav dots
  const dots=navEl.children;
  for(let j=0;j<dots.length;j++)dots[j].className=j===i?'on':j<i?'done':'';
  stTimer=0;
}
function updatePlayBtn(){document.getElementById('bpl').textContent=playing?'Pause':'Auto';
  document.getElementById('bpl').classList.toggle('on',playing);}

document.getElementById('bp').onclick=()=>{show((cur-1+scenes.length)%scenes.length)};
document.getElementById('bn').onclick=()=>{show((cur+1)%scenes.length)};
document.getElementById('bpl').onclick=()=>{playing=!playing;updatePlayBtn();};
document.getElementById('br').onclick=()=>{show(0);playing=false;updatePlayBtn();};

// Auto-advance
setInterval(()=>{
  if(playing){stTimer+=0.5;if(stTimer>=stDur){show((cur+1)%scenes.length);}}
},500);

show(0);
</script>
