<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MMX PoSpace Plot — Reference Spec</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#c0c8d8;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}
.bar{position:fixed;top:0;left:0;right:0;height:40px;background:#080d18;z-index:100;
display:flex;align-items:center;justify-content:space-between;padding:0 14px;
border-bottom:1px solid #152040}
.bar .t{font-size:14px;font-weight:700;color:#2898b8;letter-spacing:.5px}
.bar .b{display:flex;gap:4px}
.btn{background:#0e1830;color:#407090;border:1px solid #182848;padding:4px 10px;
border-radius:3px;cursor:pointer;font-size:11px;transition:all .12s}
.btn:hover{background:#182848;color:#68a0c0}
.btn.on{background:#084060;color:#fff;border-color:#086090}
#view{margin-top:40px;padding:20px;min-height:calc(100vh - 40px)}
svg{display:block;margin:0 auto;max-width:100%;height:auto}
.step-nav{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.step-nav .dot{width:28px;height:6px;background:#152040;border-radius:2px;cursor:pointer;transition:all .2s}
.step-nav .dot:hover{background:#284868}
.step-nav .dot.on{background:#086090}
.step-nav .dot.done{background:#183048}
.info{max-width:580px;margin:12px auto;padding:14px;background:#0c1018;
border:1px solid #182848;border-radius:6px;font-size:13px;line-height:1.6}
.info h2{color:#2898b8;font-size:15px;margin-bottom:4px}
.info h3{color:#407090;font-size:13px;margin-top:8px;margin-bottom:2px}
.info .d{color:#8890a0}
.info .s{color:#b0a020;font-family:monospace;font-size:11px}
.info .c{background:#060a14;border:1px solid #0a1428;border-radius:3px;padding:6px;
font-family:monospace;font-size:10px;color:#2090b0;margin:4px 0;white-space:pre-wrap;word-break:break-all}
.info .k{color:#20b898;font-weight:600;margin:5px 0;padding:5px;background:#08120c;
border-radius:3px;border:1px solid #0a2028}
.ani{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes flowDash{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes highlight{0%,100%{opacity:.2}50%{opacity:.9}}
.flow-line{stroke-dasharray:8 4;animation:flowDash 1s linear infinite}
.pulse-ani{animation:pulse 2s ease infinite}
</style>
</head>
<body>
<div class="bar"><div class="t">MMX PoSpace Plot — Reference Spec (k=29)</div>
<div class="b">
<button class="btn" id="bp">◀ Prev</button>
<button class="btn on" id="bpl">▶ Auto</button>
<button class="btn" id="bn">Next ▶</button>
<button class="btn" id="br">↻ Reset</button>
</div></div>
<div id="view"></div>
<div class="step-nav" id="nav"></div>
<div class="info" id="info"></div>

<script>
// ===== CONSTANTS (k=29 SSD) =====
const KSIZE=29, LOGBUCKETS=6, LOGBUCKETS2=14;
const NUM_BUCKETS=1<<LOGBUCKETS;        // 64 main buckets
const NUM_SUBBUCKETS=1<<LOGBUCKETS2;     // 16384 sub-buckets per main bucket
const N_TABLE=9, N_META=14, N_META_OUT=12;
const MAX_BS1=(1<<KSIZE)/NUM_BUCKETS*17/16; // ~2,228,224
const MAX_BS2=(4<<KSIZE)/NUM_BUCKETS/NUM_SUBBUCKETS/3; // ~1365
const PDSIZE=40, DSIZE=5, PDBYTES=5;
const XBITS=29, X2BYTES=8, X2SIZE=64, ENTRY_BITS_X=57;
const park_size_y=8192, park_size_pd=2048, park_size_x=2048;

const entries={1:536870912,2:536872741,3:536850867,4:536853641,5:536829092,
  6:536768040,7:536659701,8:536458310,9:536061737};

const C={Y:'#44ddff',META:'#ffaa44',PD:'#aa44ff',X:'#44ff88',F1:'#ff4466',
  HDR:'#888899',DISK:'#666688',STREAM:'#ffee44',EDGE:'#2a3858',FLOW:'#ffdd44',
  PANEL:'#0c1018',TEXT:'#687888',KEY:'#20b898',SUB:'#8844cc'};

// ===== SVG HELPERS =====
function el(tag,attrs={}){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const[k,v]of Object.entries(attrs)){if(v!==null&&v!==undefined)e.setAttribute(k,v);}return e;}
function rect(x,y,w,h,fill,op=1,stroke=null,sw=1,rx=0){
  return el('rect',{x,y,width:w,height:h,fill,opacity:op<1?op:null,stroke:stroke||'none','stroke-width':sw,rx:rx||0});}
function txt(x,y,str,fill='#687888',size=11,weight='normal',anchor='start',mono=false){
  const t=el('text',{x,y,fill,'font-size':size,'font-weight':weight,'text-anchor':anchor,
    'font-family':mono?'monospace':'Segoe UI,system-ui,sans-serif'});t.textContent=str;return t;}
function line(x1,y1,x2,y2,stroke='#2a3858',sw=1,op=1,dash=null,cls=null){
  const l=el('line',{x1,y1,x2,y2,stroke,'stroke-width':sw,opacity:op<1?op:null});
  if(dash)l.setAttribute('stroke-dasharray',dash);if(cls)l.setAttribute('class',cls);return l;}
function arrow(x1,y1,x2,y2,stroke='#ffdd44',sw=1.5){
  const g=el('g');g.appendChild(line(x1,y1,x2,y2,stroke,sw,null,'flow-line'));
  const a=Math.atan2(y2-y1,x2-x1),ax=x2-Math.cos(a)*8,ay=y2-Math.sin(a)*8;
  g.appendChild(line(x2,y2,ax+Math.cos(a+Math.PI/2)*4,ay+Math.sin(a+Math.PI/2)*4,stroke,sw));
  g.appendChild(line(x2,y2,ax-Math.cos(a+Math.PI/2)*4,ay-Math.sin(a+Math.PI/2)*4,stroke,sw));return g;}
function circle(cx,cy,r,fill='#44ddff',op=1,stroke=null,sw=1){
  return el('circle',{cx,cy,r,fill,opacity:op<1?op:null,stroke:stroke||'none','stroke-width':sw});}
function panel(x,y,w,h,title){
  const g=el('g');g.appendChild(rect(x,y,w,h,C.PANEL,0.6,C.EDGE,1,4));
  if(title)g.appendChild(txt(x+10,y+18,title,C.TEXT,11,'bold'));return g;}

const scenes=[];

// ===== Scene 1: Plot File =====
scenes.push({
name:'Plot File',
desc:'14.6 GB: header + Y table (1%) + 7 PD sections (79%) + X table (20%).',
build(){
  const W=900,H=310,s=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  s.appendChild(txt(W/2,28,'14.6 GB Plot File (k=29, SSD)',C.KEY,16,'bold','middle'));
  const bY=75,bH=48,bW=840,bX=30;
  const secs=[
    {n:'Y',sz:0.008,c:C.Y,l:'144 MB'},
    {n:'PD0',sz:0.113,c:C.PD,l:'2.0 GB'},{n:'PD1',sz:0.113,c:C.PD,l:'2.0 GB'},
    {n:'PD2',sz:0.113,c:C.PD,l:'2.0 GB'},{n:'PD3',sz:0.113,c:C.PD,l:'2.0 GB'},
    {n:'PD4',sz:0.113,c:C.PD,l:'2.0 GB'},{n:'PD5',sz:0.113,c:C.PD,l:'2.0 GB'},
    {n:'PD6',sz:0.113,c:C.PD,l:'2.0 GB'},
    {n:'X',sz:0.203,c:C.X,l:'3.6 GB'}];
  let x=bX;
  secs.forEach((sec,i)=>{const w=sec.sz*bW;if(w<2)return;
    const r=rect(x,bY,w,bH,sec.c,0.85,C.EDGE,1,3);
    r.setAttribute('class','pulse-ani');r.style.animationDelay=(i*0.12)+'s';s.appendChild(r);
    if(w>20){s.appendChild(txt(x+w/2,bY-6,sec.n,sec.c,10,'bold','middle'));
      s.appendChild(txt(x+w/2,bY+bH+14,sec.l,C.TEXT,9,'normal','middle'));}x+=w;});
  s.appendChild(rect(28,bY,4,bH,C.HDR,0.8));
  s.appendChild(txt(30,bY-6,'Hdr',C.HDR,9,'bold','middle'));
  s.appendChild(rect(bX-2,bY-2,bW+4,bH+4,'none',1,C.HDR,2,4));
  // Header detail
  s.appendChild(rect(30,155,840,70,C.PANEL,0.5,C.EDGE,1,4));
  s.appendChild(txt(40,173,'Header (4 KB, VNX-serialized, 4KB-aligned sections):',C.TEXT,11,'bold'));
  s.appendChild(txt(40,191,'version, ksize, xbits, has_meta, seed, plot_id, farmer_key, contract',C.META,10,'normal','monospace'));
  s.appendChild(txt(40,207,'park_size_{x,y,pd,meta}, park_bytes_{x,y,pd,meta}, entry_bits_x',C.META,10,'normal','monospace'));
  s.appendChild(txt(40,223,'num_entries_y, table_offset_{x,y,meta}, table_offset_pd[7]',C.META,10,'normal','monospace'));
  // Legend
  s.appendChild(txt(W/2,250,'Y=sorted T9 values · PD[0-6]=back-pointers T9→T2 · X=T2 X values as line points',C.TEXT,11,'normal','middle'));
  s.appendChild(rect(100,268,700,28,C.KEY,0.08,C.KEY,1,4));
  s.appendChild(txt(W/2,285,'PD parks = 79% of file: back-pointers for ALL 536M binary trees',C.KEY,12,'bold','middle'));
  return s;
},
info:{t:'The Plot File',d:'A binary file that proves you spent compute time.',
body:`<h3>Sections (file order)</h3>
<div class="s">Header — 4 KB: ksize=29, seed, plot_id, farmer_key, park sizes, all offsets</div>
<div class="s">Y table — 144 MB (1%): sorted Y values of table 9, delta-encoded parks</div>
<div class="s">PD[0-6] — 7 × 2.0 GB (79%): back-pointers for tables 9→8, 8→7, ..., 3→2</div>
<div class="s">X table — 3.6 GB (20%): X values of table 2, packed as 57-bit line points</div>
<div class="k">PD parks are 79% of the file — they store back-pointers for ALL 536M trees.</div>
<h3>Park Parameters</h3>
<div class="s">park_size_y=8192, park_size_pd=2048, park_size_x=2048</div>
<div class="s">Park bytes: Y≈2308B, PD≈8103B, X≈14592B</div>
<div class="s">entry_bits_x=57 (line point encoding of X pairs)</div>`}
});

// ===== Scene 2: F1 =====
scenes.push({
name:'F1: Table 1',
desc:'Memory-hard PoW: 4KB memory per X, 256-iter random access, SHA512 → Y + meta.',
build(){
  const W=900,H=340,s=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  s.appendChild(txt(W/2,25,'Table 1 (F1): Memory-Hard Proof of Work',C.KEY,15,'bold','middle'));
  s.appendChild(rect(50,130,70,40,C.X,0.8,C.EDGE,1,4));
  s.appendChild(txt(85,155,'X',C.X,14,'bold','middle'));
  s.appendChild(txt(85,185,'0..2²⁹-1',C.TEXT,10,'normal','middle'));
  s.appendChild(arrow(120,150,180,150,C.FLOW));
  // Memory grid
  const gx=190,gy=95,sz=13;
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const c=rect(gx+i*sz,gy+j*sz,sz-1,sz-1,C.F1,0.15+Math.random()*0.3,C.EDGE,0.5,1);
    c.setAttribute('class','pulse-ani');c.style.animationDelay=(i+j)*0.04+'s';s.appendChild(c);}
  s.appendChild(txt(gx+52,gy-8,'4KB memory',C.F1,11,'bold','middle'));
  s.appendChild(txt(gx+52,gy+122,'1024 uint32',C.TEXT,9,'normal','middle'));
  s.appendChild(txt(gx+52,gy+137,'32 rounds',C.TEXT,9,'normal','middle'));
  for(let i=0;i<6;i++){
    const x1=gx+Math.random()*104,y1=gy+Math.random()*104;
    const x2=gx+Math.random()*104,y2=gy+Math.random()*104;
    s.appendChild(line(x1,y1,x2,y2,'#ff6688',1,0.3,'2 2','flow-line'));}
  s.appendChild(txt(gx+52,gy+157,'256-iter random access',C.F1,9,'normal','middle'));
  s.appendChild(arrow(320,150,380,150,C.FLOW));
  s.appendChild(rect(380,125,80,50,C.F1,0.7,C.EDGE,1,4));
  s.appendChild(txt(420,155,'SHA512',C.F1,13,'bold','middle'));
  s.appendChild(txt(420,190,'key‖mem_hash',C.TEXT,9,'normal','middle'));
  s.appendChild(arrow(460,150,530,150,C.FLOW));
  // Output
  s.appendChild(rect(530,95,60,30,C.Y,0.8,C.EDGE,1,3));
  s.appendChild(txt(560,115,'Y',C.Y,12,'bold','middle'));
  s.appendChild(txt(560,140,'29-bit',C.TEXT,9,'normal','middle'));
  s.appendChild(rect(530,130,60,30,C.META,0.7,C.EDGE,1,3));
  s.appendChild(txt(560,150,'C meta',C.META,10,'bold','middle'));
  s.appendChild(txt(560,175,'14×29b',C.TEXT,9,'normal','middle'));
  s.appendChild(rect(530,165,60,30,C.X,0.8,C.EDGE,1,3));
  s.appendChild(txt(560,185,'X',C.X,12,'bold','middle'));
  s.appendChild(txt(560,210,'29-bit',C.TEXT,9,'normal','middle'));
  // Kernel chain
  s.appendChild(rect(620,75,260,135,C.PANEL,0.6,C.EDGE,1,4));
  s.appendChild(txt(630,93,'GPU Kernels:',C.TEXT,11,'bold'));
  ['gen_mem_array','calc_mem_hash','scatter_t1'].forEach((k,i)=>{
    s.appendChild(rect(630,100+i*22,240,18,C.F1,0.1,C.EDGE,0.5,2));
    s.appendChild(txt(750,113+i*22,k,C.F1,9,'bold','middle'));});
  s.appendChild(txt(630,178,'Cost: 2²⁹×4KB = 2TB writes',C.META,10,'normal','monospace'));
  s.appendChild(txt(630,194,'~9.4s RTX 5090 (compute-bound)',C.X,10,'normal','monospace'));
  return s;
},
info:{t:'F1: Table 1',d:'Memory-hard proof-of-work. The "work" that proves you spent time.',
body:`<h3>Per X value (0 to 536,870,911):</h3>
<div class="d">1. key = SHA512(X ‖ plot_id) → 16 uint32</div>
<div class="d">2. gen_mem_array: 32 rounds of hashing → 1024 uint32 (4KB)</div>
<div class="d">3. calc_mem_hash: 256 iterations of random access into 4KB</div>
<div class="d">4. scatter_t1: SHA512(key ‖ mem_hash) → Y + C</div>
<div class="c">Y = XOR(SHA512(key ‖ mem_hash)[0..13]) &amp; KMASK
C[j*14+i] = hash[i] &amp; KMASK
X[j] = X  (kept for proof)</div>
<div class="s">Cost: 2^29 × 4KB = 2TB writes. ~9.4s on RTX 5090 (compute-bound).</div>
<div class="s">Verification: only 256 X values need F1 recompute = milliseconds.</div>
<div class="k">F1 is the PoW component. Memory-hard random access cannot be parallelized.</div>`}
});

// ===== Scene 3: Match + Eval =====
scenes.push({
name:'Match + Eval',
desc:'(Y, Y+1) pair → SHA512(meta_L‖meta_R) → new entry + PD back-pointer (fixed-stride).',
build(){
  const W=900,H=400,s=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  s.appendChild(txt(W/2,25,'Match + Eval: The Core Operation',C.KEY,15,'bold','middle'));
  // Two entries
  s.appendChild(rect(50,70,110,35,C.Y,0.8,C.EDGE,1,4));
  s.appendChild(txt(105,92,'Y',C.Y,14,'bold','middle'));
  s.appendChild(rect(50,110,110,35,C.Y,0.8,C.EDGE,1,4));
  s.appendChild(txt(105,132,'Y+1',C.Y,14,'bold','middle'));
  s.appendChild(rect(50,70,25,35,C.META,0.6,C.EDGE,1,2));
  s.appendChild(rect(50,110,25,35,C.META,0.6,C.EDGE,1,2));
  s.appendChild(txt(105,165,'consecutive pair',C.FLOW,10,'bold','middle'));
  s.appendChild(arrow(160,107,280,107,C.FLOW));
  s.appendChild(txt(220,100,'meta_L ‖ meta_R',C.META,10,'normal','middle'));
  s.appendChild(rect(280,82,80,50,C.F1,0.7,C.EDGE,1,4));
  s.appendChild(txt(320,112,'SHA512',C.F1,14,'bold','middle'));
  s.appendChild(arrow(360,107,450,107,C.FLOW));
  // Output
  s.appendChild(rect(450,70,70,30,C.Y,0.8,C.EDGE,1,4));
  s.appendChild(txt(485,90,'new Y',C.Y,11,'bold','middle'));
  s.appendChild(rect(450,105,70,30,C.META,0.7,C.EDGE,1,4));
  s.appendChild(txt(485,125,'new meta',C.META,10,'bold','middle'));
  s.appendChild(rect(450,140,70,30,C.PD,0.8,C.EDGE,1,4));
  s.appendChild(txt(485,160,'PD',C.PD,12,'bold','middle'));
  s.appendChild(txt(485,188,'back-ptr',C.TEXT,9,'normal','middle'));
  // PD encoding detail
  s.appendChild(rect(560,60,320,145,C.PANEL,0.6,C.EDGE,1,4));
  s.appendChild(txt(570,78,'PD = 40 bits:',C.PD,11,'bold'));
  // Bit layout visualization
  s.appendChild(rect(570,88,210,22,C.PD,0.15,C.PD,0.5,2)); // position field
  s.appendChild(rect(780,88,35,22,C.META,0.2,C.META,0.5,2)); // delta field
  s.appendChild(txt(675,103,'position (30 bits)',C.PD,9,'bold','middle'));
  s.appendChild(txt(797,103,'δ (5b)',C.META,8,'bold','middle'));
  s.appendChild(txt(570,128,'position = y_in × max_bs1 + P_x_in',C.TEXT,9,'normal','monospace'));
  s.appendChild(txt(570,144,'  y_in = input main bucket (FIXED STRIDE)',C.TEXT,9,'normal','monospace'));
  s.appendChild(txt(570,160,'  P_x_in = pos in input sorted sub-bucket array',C.TEXT,9,'normal','monospace'));
  s.appendChild(txt(570,176,'  δ = right_parent - left_parent - 1',C.TEXT,9,'normal','monospace'));
  s.appendChild(txt(570,192,'Decode: left = PD>>5, right = left + (PD&31)+1',C.KEY,9,'bold','monospace'));
  // Back-pointer arrow
  s.appendChild(arrow(450,160,160,145,C.PD));
  s.appendChild(txt(305,138,'← points to parents',C.PD,10,'normal','middle'));
  // Bottom
  s.appendChild(rect(80,240,740,55,C.KEY,0.08,C.KEY,1,4));
  s.appendChild(txt(W/2,260,'This operation repeats 8 times: tables 2 through 9',C.KEY,12,'bold','middle'));
  s.appendChild(txt(W/2,280,'Each entry in table t has exactly 2 parents in table t-1 → binary tree structure',C.TEXT,11,'normal','middle'));
  s.appendChild(txt(W/2,300,'P(Y+1 neighbor) ≈ 63% → tables stay ~same size (NOT a funnel)',C.TEXT,11,'normal','middle'));
  return s;
},
info:{t:'Match + Eval',d:'Combine two parents with consecutive Y into one child entry.',
body:`<div class="k">Each entry in tables 2-9 is created by finding two entries with consecutive Y values.</div>
<h3>Step by step</h3>
<div class="d">1. Sort entries by Y within sub-buckets (hybrid_sort_y)</div>
<div class="d">2. match_p1: find (Y, Y+1) pairs. Store LR=(left_pos, right_pos), PD_tmp=(P_x&lt;&lt;5)|delta</div>
<div class="d">3. eval_p1_tx: SHA512(meta_L ‖ meta_R) → new Y + new meta</div>
<div class="d">4. Store PD = PD_0 + PD_in[x] at output position</div>
<div class="c">// match_p1 kernel:
P_x = bucket_offset[y] + x    // global pos in input
PD_tmp[i] = (P_x << 5) | (i - x - 1)

// eval_p1_tx kernel:
PD_0 = (y_input * max_bucket_size_1) << 5
j = y_output * max_bucket_size_1 + pos  // output position
PD_out[j] = PD_0 + PD_in[x]
         = ((y_in * max_bs1 + P_x_in) << 5) | delta</div>
<h3>PD Encoding (raw, phase 1)</h3>
<div class="s">PD = 40 bits: [position:30 bits][delta:5 bits]</div>
<div class="s">position = y_input × max_bucket_size_1 + P_x_input (FIXED STRIDE)</div>
<div class="s">delta = right_parent_pos - left_parent_pos - 1</div>
<div class="s">Phase 2 remaps positions to compact (dense) indices before park encoding</div>`}
});

// ===== Scene 4: Tables 1-9 =====
scenes.push({
name:'Tables 1-9',
desc:'9 tables, each ~536M entries. NOT a funnel. Forest of 536M binary trees.',
build(){
  const W=900,H=340,s=el('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  s.appendChild(txt(W/2,25,'The 9 Tables: Forest of 536M Binary Trees',C.KEY,15,'bold','middle'));
  const tD=[
    {n:'T1 (F1)',c:C.F1,sub:'X→hash→Y,meta',e:entries[1]},
    {n:'T2',c:C.X,sub:'stores X2 values',e:entries[2]},
    {n:'T3',c:C.PD,sub:'Y,meta,PD',e:entries[3]},
    {n:'T4',c:C.PD,sub:'Y,meta,PD',e:entries[4]},
    {n:'T5',c:C.PD,sub:'Y,meta,PD',e:entries[5]},
    {n:'T6',c:C.PD,sub:'Y,meta,PD',e:entries[6]},
    {n:'T7',c:C.PD,sub:'Y,meta,PD',e:entries[7]},
    {n:'T8',c:C.PD,sub:'Y,meta,PD',e:entries[8]},
    {n:'T9',c:C.Y,sub:'Y-sorted,final',e:entries[9]}];
  const bw=68,bh=28,sp=12,x0=80,y0=50;
  tD.forEach((t,i)=>{const x=x0+i*(bw+sp),y=y0+60;
    const r=rect(x,y,bw,bh,t.c,0.7,C.EDGE,1,3);
    r.setAttribute('class','pulse-ani');r.style.animationDelay=(i*0.1)+'s';s.appendChild(r);
    s.appendChild(txt(x+bw/2,y+18,t.n,t.c,10,'bold','middle'));
    s.appendChild(txt(x+bw/2,y+bh+12,t.sub,C.TEXT,8,'normal','middle'));
    s.appendChild(txt(x+bw/2,y+bh+26,(t.e/1e6).toFixed(1)+'M',C.META,9,'bold','middle'));
    if(i<8)s.appendChild(arrow(x+bw+2,y+bh/2,x+bw+sp-2,y+bh/2,C.FLOW));});
  s.appendChild(rect(80,195,740,50,C.KEY,0.08,C.KEY,1,4));
  s.appendChild(txt(W/2,215,'All tables ~536M entries — NOT a funnel',C.KEY,13,'bold','middle'));
  s.appendChild(txt(W/2,235,'Each entry matches ~2 partners (left AND right) → table sizes barely change',C.TEXT,11,'normal','middle'));

info:{t:'Phase 2 Pass 1: Remap',d:'Compact sparse positions to dense sequential indices.',
body:`<div class="k">Phase 2 Pass 1 removes dead entries and remaps positions to compact indices.</div>
<h3>mark_used</h3>
<div class="d">For each entry in table t, read its PD, extract P_1 and P_2 (parent positions). Set bits in a bitfield at P_1 and P_2. This marks which positions in table t-1 are actually referenced.</div>
<h3>count_used</h3>
<div class="d">Count set bits per uint32 word: count_out[x] = __popc(bitfield[x]). Then calc_offset_sum computes prefix sums.</div>
<h3>remap_pos</h3>
<div class="d">For a sparse position pos: compact = offset[pos/32] + popcount(bitfield[pos/32] &amp; mask_below(pos%32)). This gives the dense sequential index.</div>
<div class="c">// remap_pos kernel:
uint32_t remap_pos(B, offset, pos) {
    return offset[pos / 32]
         + __popc(B[pos / 32] &amp; ((1 << (pos % 32)) - 1));
}</div>
<div class="s">Raw PD: 30-bit positions with gaps (dead entries)</div>
<div class="s">Compact PD: 29-bit sequential indices (no gaps)</div>
<div class="k">Park positions are 29 bits (= ksize) because compaction removes all gaps.</div>`}
});

        const cy=50+(k+1)*38;

info:{t:'Proof = Binary Tree',d:'A proof is a binary tree walk: 1 root → 256 X value leaves.',
body:`<div class="k">Every proof is a perfect binary tree of depth 8. One root, 256 leaves.</div>
<h3>The Walk (7 PD park reads)</h3>
<div class="s">Table 9 → 1 entry (root, the Y match)</div>
<div class="s">Table 8 → 2 entries (root's parents)</div>
<div class="s">Table 7 → 4 entries</div>
<div class="s">...doubling each level...</div>
<div class="s">Table 2 → 128 entries, each has 2 X values</div>
<div class="s">Table 1 → 256 X values (leaves)</div>
<div class="c">pointers = [root_index]      // 1 entry
for t in 9→2:               // 7 steps
  new = []
  for idx in pointers:         // doubles each step
    PD = read_park(t, idx)
    left  = PD >> 5            // parent 1 (compact index)
    right = left + (PD & 31) + 1  // parent 2
    new += [left, right]
  pointers = new               // 2x each step
// 128 pointers → read X park → 256 X values</div>
<div class="s">Proof = 256 uint32 X values ≈ 1 KB</div>
<div class="k">The plot stores back-pointers for ALL 536M trees. PD = 79% of file.</div>`}
});

info:{t:'Proof Lookup (Farming)',d:'How the file is read to answer a challenge.',
body:`<div class="k">Farming = reading the file to find proofs. Three steps, all fast.</div>
<h3>Step 1: Scan Y table</h3>
<div class="d">challenge → Y_begin = SHA256("plot_challenge"‖plot_id‖challenge) &amp; KMASK</div>
<div class="d">Scan Y parks for entries in [Y_begin, Y_begin+16) (plot_filter=4, window=16)</div>

<h3>The asymmetry</h3>

// ===== RENDER ENGINE =====
let cur=0,playing=true,stTimer=0,stDur=11;
const view=document.getElementById('view');
const infoEl=document.getElementById('info');
const navEl=document.getElementById('nav');
scenes.forEach((s,i)=>{const d=document.createElement('div');d.className='dot';d.title=s.name;
  d.onclick=()=>{show(i);playing=false;updatePlayBtn();};navEl.appendChild(d);});
function show(i){
  cur=i;const sc=scenes[i];
  const svg=sc.build();const tmp=document.createElement('div');tmp.appendChild(svg);
  view.innerHTML='<div class="ani">'+tmp.innerHTML+'</div>';
  infoEl.innerHTML=`<div class="ani"><h2>${sc.info.t}</h2><div class="d">${sc.info.d}</div>${sc.info.body}</div>`;
  const dots=navEl.children;
  for(let j=0;j<dots.length;j++)dots[j].className=j===i?'on':j<i?'done':'';
  stTimer=0;}
function updatePlayBtn(){document.getElementById('bpl').textContent=playing?'Pause':'Auto';
  document.getElementById('bpl').classList.toggle('on',playing);}
document.getElementById('bp').onclick=()=>{show((cur-1+scenes.length)%scenes.length)};
document.getElementById('bn').onclick=()=>{show((cur+1)%scenes.length)};
document.getElementById('bpl').onclick=()=>{playing=!playing;updatePlayBtn();};
document.getElementById('br').onclick=()=>{show(0);playing=false;updatePlayBtn();};
setInterval(()=>{if(playing){stTimer+=0.5;if(stTimer>=stDur){show((cur+1)%scenes.length);}}},500);
show(0);
</script>
