<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MMX Plot Spec</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070710;color:#c0c8d8;font-family:system-ui,sans-serif;overflow:hidden}
#c{position:fixed;top:0;left:0;width:100%;height:100%}
.bar{position:fixed;top:0;left:0;right:0;height:38px;background:#080d18;
display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:100;
border-bottom:1px solid #101830}
.bar .t{font-size:13px;font-weight:600;color:#2a98b8;letter-spacing:.5px}
.bar .b{display:flex;gap:3px}
.btn{background:#0c1424;color:#4878a0;border:1px solid #152040;padding:3px 8px;
border-radius:3px;cursor:pointer;font-size:10px;transition:all .1s;white-space:nowrap}
.btn:hover{background:#142040;color:#68a0c0}
.btn.on{background:#084868;color:#fff;border-color:#086898}
#info{position:fixed;top:44px;right:5px;width:300px;background:rgba(6,10,20,.95);
border:1px solid #101830;border-radius:4px;padding:10px;z-index:50;
max-height:calc(100vh - 95px);overflow-y:auto;font-size:11px;line-height:1.5}
#info h2{color:#2a98b8;font-size:12px;margin-bottom:2px}
#info h3{color:#4878a0;font-size:11px;margin-top:6px;margin-bottom:2px}
#info .d{color:#7888a0;margin-bottom:4px}
#info .s{color:#b0a028;font-family:monospace;font-size:10px}
#info .c{background:#040810;border:1px solid #081020;border-radius:3px;padding:4px;
font-family:monospace;font-size:9px;color:#2898b8;margin:3px 0;white-space:pre-wrap;word-break:break-all}
#info .k{color:#28b898;font-weight:600;margin:4px 0;padding:4px;background:#060c10;
border-radius:3px;border:1px solid #082028}
#lg{position:fixed;bottom:5px;left:5px;background:rgba(6,10,20,.95);
border:1px solid #101830;border-radius:3px;padding:4px 7px;z-index:50;font-size:9px}
#lg .i{display:flex;align-items:center;gap:3px;margin:1px 0}
#lg .w{width:9px;height:9px;border-radius:1px}
#st{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);z-index:50;text-align:center}
#st .n{font-size:12px;font-weight:600;color:#2a98b8}
#st .d{font-size:9px;color:#485868;margin-top:1px;max-width:340px}
#st .dt{display:flex;gap:2px;justify-content:center;margin-top:3px}
#st .dt div{width:4px;height:4px;border-radius:50%;background:#101830;transition:all .2s}
#st .dt div.on{background:#086898}
#st .dt div.done{background:#182848}
#sp{position:fixed;bottom:5px;right:5px;z-index:50;background:rgba(6,10,20,.95);
border:1px solid #101830;border-radius:3px;padding:3px 6px;display:flex;gap:3px;
align-items:center;font-size:9px}
#sp input{width:60px;accent-color:#086898}
</style>
</head>
<body>
<div class="bar"><div class="t">MMX PoSpace Plot Spec</div>
<div class="b">
<button class="btn" id="bp">◀</button>
<button class="btn on" id="bpl">Auto</button>
<button class="btn" id="bn">▶</button>
<button class="btn" id="br">↻</button>
</div></div>
<canvas id="c"></canvas>
<div id="info"></div>
<div id="lg">
<div class="i"><div class="w" style="background:#44ddff"></div>Y (29-bit)</div>
<div class="i"><div class="w" style="background:#ffaa44"></div>Meta/C (14×29b)</div>
<div class="i"><div class="w" style="background:#aa44ff"></div>PD back-ptr (35b)</div>
<div class="i"><div class="w" style="background:#44ff88"></div>X value (29b)</div>
<div class="i"><div class="w" style="background:#ff4466"></div>SHA512 / F1</div>
</div>
<div id="st"><div class="n" id="sn"></div><div class="d" id="sd"></div><div class="dt" id="dts"></div></div>
<div id="sp"><span>Speed</span><input type="range" id="spv" min="0.3" max="3" step="0.1" value="1"><span id="spvl">1.0x</span></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const cv=document.getElementById('c'),R=new T.WebGLRenderer({canvas:cv,antialias:true});
R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new T.Scene();S.background=new T.Color(0x070710);
// Scale: everything 30% smaller than before
const SC=0.7;
const cam=new T.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
cam.position.set(0*SC,5*SC,17*SC);
const ctr=new OrbitControls(cam,cv);ctr.enableDamping=true;ctr.dampingFactor=.08;
ctr.minDistance=3;ctr.maxDistance=60;ctr.target.set(0,5*SC,0);
S.add(new T.AmbientLight(0x404868,.7));
const dl=new T.DirectionalLight(0x88aaee,.8);dl.position.set(6*SC,15*SC,8*SC);S.add(dl);
const pl=new T.PointLight(0x4466aa,.4,30*SC);pl.position.set(0,7*SC,4*SC);S.add(pl);

const C={Y:0x44ddff,META:0xffaa44,PD:0xaa44ff,X:0x44ff88,F1:0xff4466,
  HDR:0x888899,EDGE:0x2a3858,FLOW:0xffdd44,TEXT:0x6a98b8};

// ===== LABEL MAKER (text in 3D, always faces camera) =====
function makeLabel(text,x,y,z,scale=1.2,color='#6a98b8'){
  const c=document.createElement('canvas');
  c.width=256;c.height=64;
  const ctx=c.getContext('2d');
  ctx.fillStyle=color;ctx.font='bold 22px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,128,32);
  const tex=new T.CanvasTexture(c);
  const sp=new T.Sprite(new T.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sp.position.set(x*SC,y*SC,z*SC);
  const s=scale*SC;
  sp.scale.set(s,s*0.25,1);
  return sp;
}

// ===== SOLID BOX =====
function box(w,h,d,color,opacity=1){
  const geo=new T.BoxGeometry(w*SC,h*SC,d*SC);
  const mat=new T.MeshStandardMaterial({color,transparent:opacity<1,opacity,
    roughness:.6,metalness:.1,emissive:color,emissiveIntensity:0});
  const m=new T.Mesh(geo,mat);
  const eg=new T.EdgesGeometry(geo);
  m.add(new T.LineSegments(eg,new T.LineBasicMaterial({color:C.EDGE,transparent:true,opacity:.5})));
  return m;
}

// ===== GROUPS =====
const G={};function ng(n){const g=new T.Group();g.visible=false;S.add(g);G[n]=g;return g}

// ===== SCENE 1: WHAT IS A PLOT? =====
// Show the actual file as a physical object with labeled sections
const gFile=ng('file');
{
  const FW=14*SC,FH=1.1*SC,FD=0.8*SC;
  // Sections with real proportions
  const secs=[
    {n:'Y table',w:0.008,c:C.Y,lbl:'Y\n144 MB'},
    {n:'PD[0]\nT9→T8',w:0.113,c:C.PD,lbl:'PD0\n2.0 GB'},
    {n:'PD[1]\nT8→T7',w:0.113,c:C.PD,lbl:'PD1\n2.0 GB'},
    {n:'PD[2]\nT7→T6',w:0.113,c:C.PD,lbl:'PD2\n2.0 GB'},
    {n:'PD[3]\nT6→T5',w:0.113,c:C.PD,lbl:'PD3\n2.0 GB'},
    {n:'PD[4]\nT5→T4',w:0.113,c:C.PD,lbl:'PD4\n2.0 GB'},
    {n:'PD[5]\nT4→T3',w:0.113,c:C.PD,lbl:'PD5\n2.0 GB'},
    {n:'PD[6]\nT3→T2',w:0.113,c:C.PD,lbl:'PD6\n2.0 GB'},
    {n:'X table',w:0.203,c:C.X,lbl:'X\n3.6 GB'},
  ];
  let x=-FW/2;
  const boxes=[];
  for(const s of secs){
    const w=s.w*FW; if(w<0.02)continue;
    const b=box(w/SC,FH/SC,FD/SC,s.c,.8);
    b.position.set(x+w/2,4*SC,0);
    gFile.add(b);
    // Label above
    const lbl=makeLabel(s.lbl,x+w/2,4*SC+FH/2+0.3,0,0.7,C[s.c===C.Y?'TEXT':'TEXT']);
    // color the label with section color
    const cc=document.createElement('canvas');cc.width=256;cc.height=64;
    const cx=cc.getContext('2d');
    cx.fillStyle='#'+s.c.toString(16).padStart(6,'0');
    cx.font='bold 18px system-ui';cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(s.lbl,128,32);
    lbl.material.map=new T.CanvasTexture(cc);
    gFile.add(lbl);
    boxes.push({mesh:b,sec:s,x:x+w/2,w});
    x+=w;
  }
  gFile.userData.boxes=boxes;
  // Base platform
  const base=box(FW/SC+0.4,0.1,FD/SC+0.4,0x080d18,.4);
  base.position.set(0,4*SC-FH/2-0.06,0);gFile.add(base);
  // Big title
  gFile.add(makeLabel('14.6 GB Plot File (k=29 SSD)',0,6*SC,0,1.6,'#2a98b8'));
}

// ===== SCENE 2: BUILDING A TABLE (one entry → match → next table) =====
const gBuild=ng('build');
{
  const Y0=5*SC;
  // Left: two sorted Y values (Y and Y+1) as cyan boxes
  const yL=box(0.7,0.5,0.5,C.Y,.9);yL.position.set(-4*SC,Y0,0);gBuild.add(yL);
  const yR=box(0.7,0.5,0.5,C.Y,.9);yR.position.set(-4*SC,Y0-0.7,0);gBuild.add(yR);
  gBuild.add(makeLabel('Y',-4.7*SC,Y0,0.4,'#44ddff'));
  gBuild.add(makeLabel('Y+1',-4.7*SC,Y0-0.7,0.4,'#44ddff'));
  gBuild.add(makeLabel('match!',-3.8*SC,Y0-0.35,0.5,'#ffdd44'));

  // Their meta (C) shown as orange boxes
  const cL=box(0.5,0.5,0.4,C.META,.7);cL.position.set(-3.2*SC,Y0,0);gBuild.add(cL);
  const cR=box(0.5,0.5,0.4,C.META,.7);cR.position.set(-3.2*SC,Y0-0.7,0);gBuild.add(cR);
  gBuild.add(makeLabel('meta_L',-3.2*SC,Y0+0.5,0.4,'#ffaa44'));
  gBuild.add(makeLabel('meta_R',-3.2*SC,Y0-1.2,0.4,'#ffaa44'));

  // SHA512 box (combines meta_L + meta_R)
  const sha=box(0.8,0.8,0.5,C.F1,.8);sha.position.set(-1.5*SC,Y0-0.35,0);gBuild.add(sha);
  gBuild.add(makeLabel('SHA512',-1.5*SC,Y0-0.35,0.5,'#ff4466'));
  gBuild.add(makeLabel('meta_L‖meta_R',-2.4*SC,Y0-0.35,0.4,'#7888a0'));

  // Output: new Y (cyan) + new meta (orange)
  const newY=box(0.7,0.5,0.5,C.Y,.9);newY.position.set(0.5*SC,Y0,0);gBuild.add(newY);
  const newC=box(0.5,0.5,0.4,C.META,.7);newC.position.set(0.5*SC,Y0-0.7,0);gBuild.add(newC);
  gBuild.add(makeLabel('new Y',0.5*SC,Y0+0.5,0.4,'#44ddff'));
  gBuild.add(makeLabel('new meta',0.5*SC,Y0-1.2,0.4,'#ffaa44'));

  // PD back-pointer (purple, pointing back to parents)
  const pd=box(0.4,0.4,0.4,C.PD,.8);pd.position.set(2*SC,Y0-0.35,0);gBuild.add(pd);
  gBuild.add(makeLabel('PD',2*SC,Y0-0.35,0.4,'#aa44ff'));
  gBuild.add(makeLabel('30b pos\n+ 5b delta',2*SC,Y0-1.1,0.35,'#aa88cc'));

  // Arrow back to parents (dashed)
  const arrowBack=new T.BufferGeometry().setFromPoints([
    new T.Vector3(1.8*SC,Y0-0.35,0),new T.Vector3(-3.5*SC,Y0-0.35,0)
  ]);
  const aMat=new T.LineDashedMaterial({color:C.PD,dashSize:0.08,gapSize:0.05,transparent:true,opacity:.4});
  const aLine=new T.Line(arrowBack,aMat);aLine.computeLineDistances();gBuild.add(aLine);

  // "→ goes to next table" arrow
  gBuild.add(makeLabel('→ next table',1.2*SC,Y0+1.2,0.5,'#44ff88'));

  // Particles will flow: parents → SHA512 → new entry
}

// ===== SCENE 3: ALL 9 TABLES =====
const gTables=ng('tables');
{
  const TW=11*SC,TH=0.4*SC,TD=2*SC,TSP=1.2*SC;
  const tData=[
    {n:'Table 1 (F1)',c:C.F1,sub:'X → hash → Y,meta'},
    {n:'Table 2',c:C.X,sub:'stores X values'},
    {n:'Table 3',c:C.PD,sub:'Y,meta,PD'},
    {n:'Table 4',c:C.PD,sub:'Y,meta,PD'},
    {n:'Table 5',c:C.PD,sub:'Y,meta,PD'},
    {n:'Table 6',c:C.PD,sub:'Y,meta,PD'},
    {n:'Table 7',c:C.PD,sub:'Y,meta,PD'},
    {n:'Table 8',c:C.PD,sub:'Y,meta,PD'},
    {n:'Table 9',c:C.Y,sub:'Y-sorted, final'},
  ];
  const layers=[];
  for(let i=0;i<9;i++){
    const y=1.5*SC+i*TSP;
    const b=box(TW/SC,TH/SC,TD/SC,tData[i].c,.7);
    b.position.set(0,y,0);gTables.add(b);
    gTables.add(makeLabel(tData[i].n,-TW/2-0.8,y,0.5,'#'+tData[i].c.toString(16).padStart(6,'0')));
    gTables.add(makeLabel(tData[i].sub,TW/2+1.2,y,0.4,'#7888a0'));
    layers.push({mesh:b,y,data:tData[i],visible:false});
  }
  gTables.userData.layers=layers;
  // Arrows between layers
  for(let i=0;i<8;i++){
    const y1=1.5*SC+i*TSP+TH/2,y2=1.5*SC+(i+1)*TSP-TH/2;
    const arr=new T.BufferGeometry().setFromPoints([
      new T.Vector3(0,y1,0),new T.Vector3(0,y2,0)
    ]);
    gTables.add(new T.Line(arr,new T.LineBasicMaterial({color:C.FLOW,transparent:true,opacity:.15})));
  }
  gTables.add(makeLabel('All tables ~536M entries (NOT a funnel)',0,1.5*SC+9*TSP+0.3,0.7,'#28b898'));
}

// ===== SCENE 4: PROOF TREE =====
const gTree=ng('tree');
const tLevels=[];
{
  const TW=10*SC;
  for(let k=0;k<=8;k++){
    const count=1<<k;
    const y=14*SC-k*1.5*SC;
    const r=(k===0?.14:k===8?.05:.08)*SC;
    const im=new T.InstancedMesh(new T.SphereGeometry(r,10,10),
      new T.MeshStandardMaterial({color:k===0?C.Y:k===8?C.X:C.PD,
      transparent:true,opacity:.8,roughness:.5}),count);
    const m=new T.Matrix4();
    for(let i=0;i<count;i++)
      m.makeTranslation(-TW/2+(i+.5)*TW/count,y,0),im.setMatrixAt(i,m);
    im.instanceMatrix.needsUpdate=true;im.visible=false;gTree.add(im);
    tLevels.push({mesh:im,y,count,level:k});
  }
  const ev=[];
  for(let k=0;k<8;k++)for(let i=0;i<(1<<k);i++){
    const px=-5+(i+.5)*10/(1<<k),py=14-k*1.5;
    const lx=-5+(2*i+.5)*10/(1<<(k+1)),ly=14-(k+1)*1.5;
    const rx=-5+(2*i+1.5)*10/(1<<(k+1));
    ev.push(px*SC,py*SC,0,lx*SC,ly*SC,0,px*SC,py*SC,0,rx*SC,ly*SC,0);
  }
  const eg=new T.BufferGeometry();eg.setAttribute('position',new T.BufferAttribute(new Float32Array(ev),3));
  const el=new T.LineSegments(eg,new T.LineBasicMaterial({color:C.EDGE,transparent:true,opacity:.12}));
  el.visible=false;gTree.add(el);gTree.userData.edges=el;
  // Labels for levels
  gTree.add(makeLabel('1 Y match (root)',0,14*SC+0.4,0.5,'#44ddff'));
  gTree.add(makeLabel('256 X values (leaves)',0,14*SC-8*1.5*SC-0.4,0.5,'#44ff88'));
  gTree.userData.expandLevel=0;gTree.userData.expandTime=0;
}

// ===== SCENE 5: PROOF LOOKUP (file read pattern) =====
const gLookup=ng('lookup');
{
  const FW=12*SC,FH=1*SC,FD=0.7*SC;
  const secs=[
    {n:'Y',w:0.008,c:C.Y},
    {n:'PD0',w:0.113,c:C.PD},
    {n:'PD1',w:0.113,c:C.PD},
    {n:'PD2',w:0.113,c:C.PD},
    {n:'PD3',w:0.113,c:C.PD},
    {n:'PD4',w:0.113,c:C.PD},
    {n:'PD5',w:0.113,c:C.PD},
    {n:'PD6',w:0.113,c:C.PD},
    {n:'X',w:0.203,c:C.X},
  ];
  let x=-FW/2;const fb=[];
  for(const s of secs){
    const w=s.w*FW;if(w<0.03)continue;
    const b=box(w/SC,FH/SC,FD/SC,s.c,.3);
    b.position.set(x+w/2,7*SC,0);gLookup.add(b);
    fb.push({mesh:b,sec:s,x:x+w/2,w});x+=w;
  }
  gLookup.userData.fb=fb;
  // Step labels above file
  gLookup.add(makeLabel('Step 1: Scan Y table',fb[0].x,8.5*SC,0.5,'#44ddff'));
  gLookup.add(makeLabel('Step 2: Walk PD parks (9→2)',fb[4].x,8.5*SC,0.5,'#aa44ff'));
  gLookup.add(makeLabel('Step 3: Read X table',fb[8].x,8.5*SC,0.5,'#44ff88'));
  // Output
  gLookup.add(makeLabel('→ 256 X values = proof',0,5*SC,0.6,'#44ff88'));
  gLookup.userData.timer=0;
}

// ===== PARTICLES =====
class P{
  constructor(){this.m=new T.Mesh(new T.SphereGeometry(.03*SC,4,4),
    new T.MeshBasicMaterial({color:C.FLOW,transparent:true,opacity:.6}));
    this.m.visible=false;this.active=false;this.t=0;S.add(this.m);}
  fire(f,to,c,sp=.5,ar=.3){this.f=f.clone();this.to=to.clone();this.t=0;this.sp=sp;this.ar=ar;
    this.active=true;this.m.visible=true;this.m.material.color.setHex(c);this.m.material.opacity=.6;}
  upd(dt){if(!this.active)return;this.t+=this.sp*dt;
    if(this.t>=1){this.active=false;this.m.visible=false;return;}
    const t=this.t;this.m.position.lerpVectors(this.f,this.to,t);
    this.m.position.y+=Math.sin(t*Math.PI)*this.ar*SC;
    this.m.material.opacity=.6*Math.sin(t*Math.PI);}
}
const pool=[];for(let i=0;i<50;i++)pool.push(new P());
let pi=0;function spawn(f,to,c,sp,ar){pool[pi].fire(f,to,c,sp,ar);pi=(pi+1)%pool.length;}

// ===== STEPS =====
const steps=[
{name:'The Plot File',desc:'A 14.6 GB binary file. 79% is back-pointers, 20% X values, 1% Y table.',
 group:'file',cam:{p:[0,5,12],t:[0,4,0]},
 info:{t:'What is an MMX plot?',d:'A single file that lets you prove you spent compute time, without redoing it.',
 body:`<div class="k">A plot file = proof you did the work, stored compactly.</div>
<h3>Analogy</h3>
<div class="d">Imagine solving 536 million puzzles. You write down the answers in a file. Later, someone challenges you: "show me the answer to puzzle #12345". You look it up in seconds instead of re-solving.</div>
<h3>File sections (left to right)</h3>
<div class="s">Y table (144 MB, 1%) — sorted answer keys of the final table</div>
<div class="s">PD[0-6] (7 × 2 GB = 79%) — "where did this come from?" back-pointers</div>
<div class="s">X table (3.6 GB, 20%) — original X values (the puzzle inputs)</div>
<div class="k">The back-pointers (PD) are 79% of the file. They let you trace any answer back to its roots.</div>
<div class="s">Total: 14.6 GB for k=29 (536M entries)</div>`}},

{name:'How a Table Entry is Built',desc:'Two entries with Y and Y+1 → SHA512 their meta → new entry. This is the core operation.',
 group:'build',cam:{p:[0,5,11],t:[0,4.5,0]},
 info:{t:'Building a Table Entry',d:'The fundamental operation: combine two parents into one child.',
 body:`<div class="k">Each entry in tables 2-9 is created by finding two entries with consecutive Y values.</div>
<h3>Step by step</h3>
<div class="d">1. Sort entries by Y value</div>
<div class="d">2. Find a pair where Y and Y+1 are both present</div>
<div class="d">3. Concatenate their meta: meta_L ‖ meta_R</div>
<div class="d">4. SHA512 that → new Y + new meta</div>
<div class="d">5. Store PD back-pointer so you can find the parents later</div>
<div class="c">block = meta_L ‖ meta_R    // 2×14×29 = 812 bits
hash = SHA512(block)          // 512 bits = 16 uint32
Y_new = XOR(hash[0..13]) &amp; KMASK  // 29-bit Y
meta_new = hash[0..13] &amp; KMASK     // 14×29-bit meta
PD = (left_parent_index &lt;&lt; 5) | delta
  // points back to the two parents</div>
<h3>Why Y and Y+1?</h3>
<div class="d">Y values are random in 2^29 space. The probability of finding Y+1 next to any Y is ~63%. This is how the binary tree forms: every child has exactly 2 parents.</div>
<div class="s">This operation repeats 8 times (tables 2-9).</div>`}},

{name:'Tables 1-9',desc:'9 tables, each ~536M entries. All roughly the same size — NOT a funnel.',
 group:'tables',cam:{p:[0,7,16],t:[0,6,0]},
 info:{t:'The 9 Tables',d:'Table 1 generates hashes. Tables 2-9 combine them. All stay ~same size.',
 body:`<div class="k">All 9 tables have ~536M entries. They do NOT shrink like a funnel.</div>
<h3>Table 1 (F1) — The Work</h3>
<div class="d">Each X (0 to 536M-1) goes through a memory-hard hash:</div>
<div class="d">X → generate 4KB memory → 256 random accesses → SHA512 → (Y, meta)</div>
<div class="s">This takes 9.4s and cannot be shortcut. It IS the proof-of-work.</div>
<h3>Tables 2-9 — The Tree</h3>
<div class="d">Each table finds (Y, Y+1) pairs and hashes their meta together.</div>
<div class="d">Each entry = 1 binary tree node with 2 parents.</div>
<div class="s">Table 2 stores X values (the tree leaves)</div>
<div class="s">Tables 3-8 store PD back-pointers (the tree branches)</div>
<div class="s">Table 9 is Y-sorted (for fast challenge lookup)</div>
<h3>Why same size?</h3>
<div class="d">With 536M entries in 536M Y-space, each entry matches ~2 partners (once as left, once as right). So matches ≈ entries. No shrinkage.</div>
<div class="s">T1: 536,870,912 → T9: 536,061,737 (only 0.15% smaller)</div>
<div class="s">Compute: T1=9.6s (F1), T2-T9=28.7s total (DMA-bound)</div>`}},

{name:'Proof = Binary Tree',desc:'One proof = walk 1 root → 2 → 4 → ... → 256 leaves. Perfect depth-8 tree.',
 group:'tree',cam:{p:[0,8,18],t:[0,7,0]},
 info:{t:'Proof Structure',d:'A proof is a binary tree walk: from 1 root to 256 X value leaves.',
 body:`<div class="k">Every proof is a perfect binary tree of depth 8. One root, 256 leaves.</div>
<h3>The Walk</h3>
<div class="d">Start: 1 entry at table 9 (the Y match)</div>
<div class="d">Each PD gives 2 back-pointers → the 2 parents in the previous table</div>
<div class="s">Table 9 → 1 entry (root)</div>
<div class="s">Table 8 → 2 entries</div>
<div class="s">Table 7 → 4 entries</div>
<div class="s">...doubling each level...</div>
<div class="s">Table 2 → 128 entries, each has 2 X values</div>
<div class="s">Table 1 → 256 X values (leaves)</div>
<div class="c">pointers = [root_index]      // 1 entry
for t in 9→2:               // 7 steps
  new = []
  for idx in pointers:         // doubles
    PD = read_back_ptr(t, idx)
    left  = PD >> 5            // parent 1
    right = left + (PD & 31) + 1  // parent 2
    new += [left, right]
  pointers = new               // 2× each step
// 128 pointers → read X park → 256 X values</div>
<div class="s">Proof = 256 uint32 X values ≈ 1 KB</div>
<div class="k">The plot file stores back-pointers for ALL 536M trees. That is why PD is 79% of the file.</div>`}},

{name:'Proof Lookup',desc:'Challenge → scan Y → walk PD parks → read X park → 256 X values. Milliseconds.',
 group:'lookup',cam:{p:[0,7,14],t:[0,6,0]},
 info:{t:'Proof Lookup',d:'How the file is read to answer a challenge.',
 body:`<div class="k">Farming = reading the file to find proofs. Three steps, all fast.</div>
<h3>Step 1: Scan Y table</h3>
<div class="d">challenge → Y_begin (29-bit target)</div>
<div class="d">Scan Y parks for entries in [Y_begin, Y_begin+16)</div>
<div class="s">Y is sorted → binary search. Each hit = 1 tree root.</div>
<h3>Step 2: Walk PD parks</h3>
<div class="d">For each Y match, read PD parks from table 9 down to table 2:</div>
<div class="s">PD[0]: T9→T8 → 2 pointers</div>
<div class="s">PD[1]: T8→T7 → 4 pointers</div>
<div class="s">...7 parks, doubling each time...</div>
<div class="s">PD[6]: T3→T2 → 128 pointers</div>
<h3>Step 3: Read X park</h3>
<div class="d">128 table-2 indices → read X park → 256 X values</div>
<div class="s">X park stores line points: 57 bits each → split into (X1, X2)</div>
<h3>The asymmetry</h3>
<div class="k">Lookup = O(parks read) = milliseconds. Plotting = O(536M) = 42 seconds.</div>
<div class="d">To fake a proof without the file, you must recompute from scratch (42s). With the file, lookup is instant. This IS proof-of-space.</div>
<div class="s">Verification: recompute tree from 256 X values → 1 Y. O(256) = milliseconds.</div>`}},
];

// ===== STEP MANAGEMENT =====
let cur=0,playing=true,stTimer=0,stDur=9,speed=1;
const dts=document.getElementById('dts');
for(let i=0;i<steps.length;i++){const d=document.createElement('div');dts.appendChild(d);}
function showStep(i){
  cur=i;const s=steps[i];
  Object.values(G).forEach(g=>g.visible=false);
  if(s.group&&G[s.group])G[s.group].visible=true;
  document.getElementById('sn').textContent=s.name;
  document.getElementById('sd').textContent=s.desc;
  document.getElementById('info').innerHTML=`<h2>${s.info.t}</h2><div class="d">${s.info.d}</div>${s.info.body}`;
  const ds=dts.children;
  for(let j=0;j<ds.length;j++)ds[j].className=j===i?'on':j<i?'done':'';
  camT={p:new T.Vector3(...s.cam.p.map(v=>v)),t:new T.Vector3(...s.cam.t.map(v=>v)),f:0};
  stTimer=0;
  if(s.group==='tree'){gTree.userData.expandLevel=0;gTree.userData.expandTime=0;
    tLevels.forEach(l=>l.mesh.visible=false);gTree.userData.edges.visible=false;}
  if(s.group==='file')gFile.userData.boxes.forEach(b=>{b.mesh.material.opacity=.2;b.mesh.material.emissiveIntensity=0;});
  if(s.group==='lookup'){gLookup.userData.timer=0;
    gLookup.userData.fb.forEach(b=>{b.mesh.material.opacity=.3;b.mesh.material.emissiveIntensity=0;});}
  if(s.group==='tables')gTables.userData.layers.forEach(l=>{l.mesh.material.opacity=.2;l.mesh.material.emissiveIntensity=0;});
}
let camT={p:cam.position.clone(),t:ctr.target.clone(),f:1};

// ===== BUTTONS =====
document.getElementById('bp').onclick=()=>showStep((cur-1+steps.length)%steps.length);
document.getElementById('bn').onclick=()=>showStep((cur+1)%steps.length);
document.getElementById('bpl').onclick=()=>{playing=!playing;
  document.getElementById('bpl').textContent=playing?'Pause':'Auto';
  document.getElementById('bpl').classList.toggle('on',playing);};
document.getElementById('br').onclick=()=>{showStep(0);playing=false;
  document.getElementById('bpl').textContent='Auto';document.getElementById('bpl').classList.remove('on');};
document.getElementById('spv').oninput=e=>{speed=parseFloat(e.target.value);
  document.getElementById('spvl').textContent=speed.toFixed(1)+'x';};

// ===== ANIMATION =====
const cl=new T.Clock();let time=0;
let fileT=0,buildT=0,tableT=0,treeT=0,lookT=0;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(cl.getDelta(),.05)*speed;
  if(playing)time+=dt;
  if(camT.f<1){camT.f=Math.min(1,camT.f+dt*2);
    const f=camT.f*camT.f*(3-2*camT.f);
    cam.position.lerp(camT.p,f*.05);ctr.target.lerp(camT.t,f*.05);}
  if(playing){stTimer+=dt;if(stTimer>=stDur)showStep((cur+1)%steps.length);}

  // FILE: build sections left to right
  if(G.file.visible){
    fileT+=dt;
    const boxes=gFile.userData.boxes;
    const shown=Math.floor(fileT/0.6);
    boxes.forEach((b,i)=>{
      if(i<shown){b.mesh.material.opacity=.85;b.mesh.material.emissiveIntensity=.15;}
      else{b.mesh.material.opacity=.15;b.mesh.material.emissiveIntensity=0;}
    });
  }

  // BUILD: flow particles through the chain
  if(G.build.visible){
    buildT+=dt;
    // parents → SHA512
    if(Math.random()<.25)
      spawn(new T.Vector3(-3*SC,4.5*SC,0),new T.Vector3(-1.8*SC,4.5*SC,0),C.META,.8,.2);
    // SHA512 → new entry
    if(Math.random()<.2)
      spawn(new T.Vector3(-1.2*SC,4.5*SC,0),new T.Vector3(0.3*SC,4.5*SC,0),C.Y,.8,.2);
    // PD → back to parents (purple, reverse)
    if(Math.random()<.15)
      spawn(new T.Vector3(1.8*SC,4.5*SC,0),new T.Vector3(-3.5*SC,4.5*SC,0),C.PD,.5,.1);
  }

  // TABLES: light up bottom to top
  if(G.tables.visible){
    tableT+=dt;
    const layers=gTables.userData.layers;
    const shown=Math.floor(tableT/0.5);
    layers.forEach((l,i)=>{
      if(i<=shown){l.mesh.material.opacity=.7;l.mesh.material.emissiveIntensity=i===shown?.2:.05;}
      else{l.mesh.material.opacity=.15;}
    });
    if(Math.random()<.1){
      const i=Math.floor(Math.random()*8);
      const y1=1.5*SC+i*1.2*SC+0.2,y2=1.5*SC+(i+1)*1.2*SC-0.2;
      spawn(new T.Vector3(0,y1,0),new T.Vector3(0,y2,0),
           i===0?C.F1:i===8?C.Y:C.PD,.6,.2);
    }
  }

  // TREE: expand level by level
  if(G.tree.visible){
    treeT+=dt;
    const lvl=Math.floor(treeT/0.5);
    if(lvl>gTree.userData.expandLevel&&lvl<=8){
      gTree.userData.expandLevel=lvl;
      if(lvl<=8&&tLevels[lvl]){tLevels[lvl].mesh.visible=true;
        if(lvl>0)tLevels[lvl-1].mesh.material.opacity=.4;}
      if(lvl>=1)gTree.userData.edges.visible=true;
    }
    if(gTree.userData.expandLevel<=8){
      const cl=tLevels[gTree.userData.expandLevel];
      if(cl&&cl.mesh.visible)cl.mesh.material.opacity=.5+Math.sin(time*5)*.3;
    }
    if(Math.random()<.25){
      const k=Math.floor(Math.random()*8);
      const count=1<<k;
      const x=(-5+(Math.floor(Math.random()*count)+.5)*10/count)*SC;
      const y1=(14-k*1.5)*SC,y2=(14-(k+1)*1.5)*SC;
      spawn(new T.Vector3(x,y1,0),new T.Vector3(x,y2,0),k===0?C.Y:C.PD,.8,.1);
    }
  }

  // LOOKUP: highlight sections sequentially
  if(G.lookup.visible){
    lookT+=dt;
    const fb=gLookup.userData.fb;
    const phase=Math.floor(lookT/1.2);
    fb.forEach((b,i)=>{b.mesh.material.opacity=.3;b.mesh.material.emissiveIntensity=0;});
    if(phase===0){
      fb[0].mesh.material.opacity=.9;fb[0].mesh.material.emissiveIntensity=.3;
      if(Math.random()<.3)spawn(new T.Vector3(fb[0].x,7*SC,0),new T.Vector3(fb[0].x,5.5*SC,0),C.Y,.6,.2);
    }else if(phase>=1&&phase<=7){
      fb[phase].mesh.material.opacity=.9;fb[phase].mesh.material.emissiveIntensity=.3;
      if(Math.random()<.3){
        const prev=phase>1?fb[phase-1].x:fb[0].x;
        spawn(new T.Vector3(prev,7*SC,0),new T.Vector3(fb[phase].x,7*SC,0),C.PD,.8,.1);
      }
    }else if(phase>=8){
      fb[8].mesh.material.opacity=.9;fb[8].mesh.material.emissiveIntensity=.3;
      if(Math.random()<.3)spawn(new T.Vector3(fb[8].x,7*SC,0),new T.Vector3(fb[8].x,5.5*SC,0),C.X,.6,.2);
    }
    if(phase>10){lookT=0;}
  }

  pool.forEach(p=>p.upd(dt));
  ctr.update();R.render(S,cam);
}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
showStep(0);animate();
</script>
</body>
</html>
