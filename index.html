<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MMX Plot Spec</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060610;color:#b8c0d8;font-family:system-ui,sans-serif;overflow:hidden}
#c{position:fixed;top:0;left:0;width:100%;height:100%}
.bar{position:fixed;top:0;left:0;right:0;height:36px;background:#070b16;
display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:100;
border-bottom:1px solid #0e1830}
.bar .t{font-size:12px;font-weight:600;color:#2898b8;letter-spacing:.5px}
.bar .b{display:flex;gap:3px}
.btn{background:#0a1220;color:#407090;border:1px solid #101830;padding:2px 7px;
border-radius:2px;cursor:pointer;font-size:10px;transition:all .1s;white-space:nowrap}
.btn:hover{background:#122040;color:#6090b0}
.btn.on{background:#084060;color:#fff;border-color:#086090}
#info{position:fixed;top:40px;right:4px;width:280px;background:rgba(5,8,16,.95);
border:1px solid #0e1830;border-radius:3px;padding:8px;z-index:50;
max-height:calc(100vh - 88px);overflow-y:auto;font-size:11px;line-height:1.4}
#info h2{color:#2898b8;font-size:12px;margin-bottom:2px}
#info h3{color:#407090;font-size:11px;margin-top:5px;margin-bottom:1px}
#info .d{color:#687888;margin-bottom:3px}
#info .s{color:#a09818;font-family:monospace;font-size:10px}
#info .c{background:#030610;border:1px solid #081020;border-radius:2px;padding:3px;
font-family:monospace;font-size:9px;color:#2090b0;margin:2px 0;white-space:pre-wrap;word-break:break-all}
#info .k{color:#20b898;font-weight:600;margin:3px 0;padding:3px;background:#04080c;
border-radius:2px;border:1px solid #061820}
#lg{position:fixed;bottom:4px;left:4px;background:rgba(5,8,16,.95);
border:1px solid #0e1830;border-radius:2px;padding:3px 6px;z-index:50;font-size:9px}
#lg .i{display:flex;align-items:center;gap:3px;margin:1px 0}
#lg .w{width:8px;height:8px;border-radius:1px}
#st{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);z-index:50;text-align:center}
#st .n{font-size:11px;font-weight:600;color:#2898b8}
#st .d{font-size:9px;color:#384858;margin-top:1px;max-width:320px}
#st .dt{display:flex;gap:2px;justify-content:center;margin-top:2px}
#st .dt div{width:4px;height:4px;border-radius:50%;background:#0e1830;transition:all .2s}
#st .dt div.on{background:#086090}
#st .dt div.done{background:#183048}
#sp{position:fixed;bottom:4px;right:4px;z-index:50;background:rgba(5,8,16,.95);
border:1px solid #0e1830;border-radius:2px;padding:2px 5px;display:flex;gap:2px;
align-items:center;font-size:9px}
#sp input{width:50px;accent-color:#086090}
</style>
</head>
<body>
<div class="bar"><div class="t">MMX PoSpace Plot Reference</div>
<div class="b">
<button class="btn" id="bp">◀</button>
<button class="btn on" id="bpl">Auto</button>
<button class="btn" id="bn">▶</button>
<button class="btn" id="br">↻</button>
</div></div>
<canvas id="c"></canvas>
<div id="info"></div>
<div id="lg">
<div class="i"><div class="w" style="background:#44ddff"></div>Y</div>
<div class="i"><div class="w" style="background:#ffaa44"></div>Meta/C</div>
<div class="i"><div class="w" style="background:#aa44ff"></div>PD back-ptr</div>
<div class="i"><div class="w" style="background:#44ff88"></div>X value</div>
<div class="i"><div class="w" style="background:#ff4466"></div>SHA512/F1</div>
<div class="i"><div class="w" style="background:#888899"></div>Disk/File</div>
<div class="i"><div class="w" style="background:#ffee44"></div>GPU stream</div>
</div>
<div id="st"><div class="n" id="sn"></div><div class="d" id="sd"></div><div class="dt" id="dts"></div></div>
<div id="sp"><span>Speed</span><input type="range" id="spv" min="0.3" max="3" step="0.1" value="1"><span id="spvl">1.0x</span></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const cv=document.getElementById('c'),R=new T.WebGLRenderer({canvas:cv,antialias:true});
R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new T.Scene();S.background=new T.Color(0x060610);
const SC=0.65;
const cam=new T.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
cam.position.set(0*SC,4*SC,14*SC);
const ctr=new OrbitControls(cam,cv);ctr.enableDamping=true;ctr.dampingFactor=.08;
ctr.minDistance=3;ctr.maxDistance=50;ctr.target.set(0,4*SC,0);
S.add(new T.AmbientLight(0x384868,.7));
const dl=new T.DirectionalLight(0x88aaee,.8);dl.position.set(5*SC,12*SC,7*SC);S.add(dl);
const pl=new T.PointLight(0x4466aa,.3,25*SC);pl.position.set(0,6*SC,3*SC);S.add(pl);

const C={Y:0x44ddff,META:0xffaa44,PD:0xaa44ff,X:0x44ff88,F1:0xff4466,
  HDR:0x888899,EDGE:0x1a2840,FLOW:0xffdd44,DISK:0x666688,STREAM:0xffee44};

function makeLabel(text,x,y,z,scale=1,color='#5888a0'){
  const c=document.createElement('canvas');c.width=256;c.height=48;
  const ctx=c.getContext('2d');ctx.fillStyle=color;ctx.font='bold 18px system-ui';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,128,24);
  const sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true,depthTest:false}));
  sp.position.set(x*SC,y*SC,z*SC);const s=scale*SC;sp.scale.set(s,s*0.19,1);return sp;
}
function box(w,h,d,color,opacity=1){
  const geo=new T.BoxGeometry(w*SC,h*SC,d*SC);
  const mat=new T.MeshStandardMaterial({color,transparent:opacity<1,opacity,roughness:.6,metalness:.1,emissive:color,emissiveIntensity:0});
  const m=new T.Mesh(geo,mat);
  m.add(new T.LineSegments(new T.EdgesGeometry(geo),new T.LineBasicMaterial({color:C.EDGE,transparent:true,opacity:.4})));
  return m;
}
const G={};function ng(n){const g=new T.Group();g.visible=false;S.add(g);G[n]=g;return g}

// ===== SCENE 1: PLOT FILE =====
const gFile=ng('file');
{
  const FW=12*SC,FH=0.9*SC,FD=0.6*SC;
  const secs=[
    {n:'Y\n144MB',w:0.008,c:C.Y},
    {n:'PD0\n2.0GB',w:0.113,c:C.PD},{n:'PD1\n2.0GB',w:0.113,c:C.PD},
    {n:'PD2\n2.0GB',w:0.113,c:C.PD},{n:'PD3\n2.0GB',w:0.113,c:C.PD},
    {n:'PD4\n2.0GB',w:0.113,c:C.PD},{n:'PD5\n2.0GB',w:0.113,c:C.PD},
    {n:'PD6\n2.0GB',w:0.113,c:C.PD},{n:'X\n3.6GB',w:0.203,c:C.X},
  ];
  let x=-FW/2;const boxes=[];
  for(const s of secs){const w=s.w*FW;if(w<0.02)continue;
    const b=box(w/SC,FH/SC,FD/SC,s.c,.8);b.position.set(x+w/2,3*SC,0);gFile.add(b);
    gFile.add(makeLabel(s.n,x+w/2,3*SC+FH/2+0.2,0.6,'#'+s.c.toString(16).padStart(6,'0')));
    boxes.push({mesh:b,sec:s,x:x+w/2,w});x+=w;}
  gFile.userData.boxes=boxes;
  const base=box(FW/SC+0.3,0.08,FD/SC+0.3,0x06090c,.3);base.position.set(0,3*SC-FH/2-0.05,0);gFile.add(base);
  gFile.add(makeLabel('14.6 GB Plot File (k=29 SSD)',0,4.5*SC,0,1.3,'#2898b8'));
}

// ===== SCENE 2: F1 TABLE 1 =====
const gF1=ng('f1');
{
  const N=8,sz=0.18;
  const mg=new T.InstancedMesh(new T.BoxGeometry(sz,sz,sz),
    new T.MeshStandardMaterial({color:C.F1,transparent:true,opacity:.3,roughness:.5}),N*N);
  const m=new T.Matrix4();
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    m.makeTranslation((i-N/2)*sz*1.3,4*SC,(j-N/2)*sz*1.3);mg.setMatrixAt(i*N+j,m);}
  mg.instanceMatrix.needsUpdate=true;mg.userData={N,sz};gF1.add(mg);gF1.userData.memMesh=mg;
  gF1.add(makeLabel('4KB memory array\n1024 uint32',0,5.5*SC,0,0.9,'#ff4466'));
  gF1.add(makeLabel('256-iter random access',0,2.5*SC,0,0.7,'#ff8866'));
  // X in, Y out
  gF1.add(box(0.6,0.4,0.4,C.X,.8)).position?.set?.(-4*SC,4*SC,0);
  const xIn=box(0.5,0.4,0.4,C.X,.8);xIn.position.set(-4*SC,4*SC,0);gF1.add(xIn);
  const yOut=box(0.5,0.4,0.4,C.Y,.8);yOut.position.set(4*SC,4*SC,0);gF1.add(yOut);
  gF1.add(makeLabel('X in',-4*SC,4.6*SC,0,0.5,'#44ff88'));
  gF1.add(makeLabel('Y out',4*SC,4.6*SC,0,0.5,'#44ddff'));
}

// ===== SCENE 3: TABLE ENTRY (match + eval) =====
const gEntry=ng('entry');
{
  const Y0=4*SC;
  const yL=box(0.6,0.4,0.4,C.Y,.9);yL.position.set(-3.5*SC,Y0,0);gEntry.add(yL);
  const yR=box(0.6,0.4,0.4,C.Y,.9);yR.position.set(-3.5*SC,Y0-0.6,0);gEntry.add(yR);
  gEntry.add(makeLabel('Y',-4.2*SC,Y0,0.35,'#44ddff'));
  gEntry.add(makeLabel('Y+1',-4.2*SC,Y0-0.6,0.35,'#44ddff'));
  const cL=box(0.4,0.4,0.3,C.META,.7);cL.position.set(-2.8*SC,Y0,0);gEntry.add(cL);
  const cR=box(0.4,0.4,0.3,C.META,.7);cR.position.set(-2.8*SC,Y0-0.6,0);gEntry.add(cR);
  gEntry.add(makeLabel('meta_L',-2.8*SC,Y0+0.4,0.35,'#ffaa44'));
  gEntry.add(makeLabel('meta_R',-2.8*SC,Y0-1,0.35,'#ffaa44'));
  const sha=box(0.7,0.7,0.4,C.F1,.8);sha.position.set(-1.3*SC,Y0-0.3,0);gEntry.add(sha);
  gEntry.add(makeLabel('SHA512',-1.3*SC,Y0-0.3,0.4,'#ff4466'));
  const newY=box(0.6,0.4,0.4,C.Y,.9);newY.position.set(0.4*SC,Y0,0);gEntry.add(newY);
  const newC=box(0.4,0.4,0.3,C.META,.7);newC.position.set(0.4*SC,Y0-0.6,0);gEntry.add(newC);
  gEntry.add(makeLabel('new Y',0.4*SC,Y0+0.4,0.35,'#44ddff'));
  const pd=box(0.35,0.35,0.35,C.PD,.8);pd.position.set(1.8*SC,Y0-0.3,0);gEntry.add(pd);
  gEntry.add(makeLabel('PD',1.8*SC,Y0-0.3,0.35,'#aa44ff'));
  gEntry.add(makeLabel('30b pos+5b delta',1.8*SC,Y0-0.9,0.3,'#aa88cc'));
}

// ===== SCENE 4: ALL 9 TABLES =====
const gTables=ng('tables');
{
  const TW=10*SC,TH=0.35*SC,TD=1.8*SC,TSP=1.1*SC;
  const tD=[
    {n:'T1 F1',c:C.F1,s:'X→hash→Y,meta'},
    {n:'T2',c:C.X,s:'stores X values'},
    {n:'T3',c:C.PD,s:'Y,meta,PD'},
    {n:'T4',c:C.PD,s:'Y,meta,PD'},{n:'T5',c:C.PD,s:'Y,meta,PD'},
    {n:'T6',c:C.PD,s:'Y,meta,PD'},{n:'T7',c:C.PD,s:'Y,meta,PD'},
    {n:'T8',c:C.PD,s:'Y,meta,PD'},
    {n:'T9',c:C.Y,s:'Y-sorted, final'},
  ];
  const layers=[];
  for(let i=0;i<9;i++){const y=1.3*SC+i*TSP;
    const b=box(TW/SC,TH/SC,TD/SC,tD[i].c,.7);b.position.set(0,y,0);gTables.add(b);
    gTables.add(makeLabel(tD[i].n,-TW/2-0.7,y,0.4,'#'+tD[i].c.toString(16).padStart(6,'0')));
    gTables.add(makeLabel(tD[i].s,TW/2+1,y,0.35,'#687888'));
    layers.push({mesh:b,y,data:tD[i]});}
  gTables.userData.layers=layers;
  gTables.add(makeLabel('All tables ~536M entries',0,1.3*SC+9*TSP+0.2,0.6,'#20b898'));
}

// ===== SCENE 5: GPU PIPELINE (streams, upload/download, RAM/disk) =====
const gPipe=ng('pipe');
{
  const PY=4*SC;
  // RAM block (left)
  const ram=box(3,2.5,1.5,C.HDR,.2);ram.position.set(-5*SC,PY,0);gPipe.add(ram);
  gPipe.add(makeLabel('RAM\n(host buckets)',-5*SC,PY+1.5,0.6,'#888899'));
  // GPU block (right)
  const gpu=box(3,2.5,1.5,C.STREAM,.15);gpu.position.set(5*SC,PY,0);gPipe.add(gpu);
  gPipe.add(makeLabel('GPU\n(device)',5*SC,PY+1.5,0.6,'#ffee44'));
  // 4 streams (parallel arrows)
  for(let s=0;s<4;s++){
    const sy=PY-0.8+s*0.5;
    const arr=new T.BufferGeometry().setFromPoints([
      new T.Vector3(-3.5*SC,sy,0),new T.Vector3(3.5*SC,sy,0)]);
    gPipe.add(new T.Line(arr,new T.LineBasicMaterial({color:C.STREAM,transparent:true,opacity:.3})));
    gPipe.add(makeLabel('S'+s,-3.5*SC,sy+0.15,0.3,'#ffee44'));
  }
  gPipe.add(makeLabel('Upload (PCIe DMA)',0,PY+1.2,0.5,'#ffee44'));
  // Download arrows (reverse)
  for(let s=0;s<4;s++){
    const sy=PY-0.8+s*0.5;
    const arr=new T.BufferGeometry().setFromPoints([
      new T.Vector3(3.5*SC,sy-0.1,0.3),new T.Vector3(-3.5*SC,sy-0.1,0.3)]);
    gPipe.add(new T.Line(arr,new T.LineBasicMaterial({color:C.PD,transparent:true,opacity:.2})));
  }
  gPipe.add(makeLabel('Download (PCIe DMA)',0,PY-1.5,0.5,'#aa44ff'));
  // Disk (bottom)
  const disk=box(6,0.4,2,C.DISK,.3);disk.position.set(0,PY-2.5,0);gPipe.add(disk);
  gPipe.add(makeLabel('Disk (phase 2 only)',0,PY-2.5,0.5,'#666688'));
}

// ===== SCENE 6: PHASE 2 (park encoding) =====
const gP2=ng('p2');
{
  const PY=5*SC;
  // Pass 1: mark_used + count + remap (compaction)
  const p1a=box(1.5,0.8,0.5,C.PD,.6);p1a.position.set(-4*SC,PY,0);gP2.add(p1a);
  gP2.add(makeLabel('Pass 1: mark_used\n+ count + remap',-4*SC,PY+0.8,0.5,'#aa44ff'));
  // Raw PD (sparse, with gaps)
  const raw=box(2,0.4,0.3,C.PD,.4);raw.position.set(-4*SC,PY-1.5,0);gP2.add(raw);
  gP2.add(makeLabel('raw PD (sparse)',-4*SC,PY-2,0.4,'#aa88cc'));
  // Pass 2: encode to parks
  const p2a=box(1.5,0.8,0.5,C.Y,.6);p2a.position.set(0,PY,0);gP2.add(p2a);
  gP2.add(makeLabel('Pass 2: encode\nsort + delta-encode',0,PY+0.8,0.5,'#44ddff'));
  // Compact PD (dense, no gaps)
  const compact=box(1.5,0.4,0.3,C.PD,.5);compact.position.set(0,PY-1.5,0);gP2.add(compact);
  gP2.add(makeLabel('compact PD (dense)',0,PY-2,0.4,'#aa88cc'));
  // Park output (file write)
  const park=box(2,0.6,0.4,C.HDR,.6);park.position.set(4*SC,PY,0);gP2.add(park);
  gP2.add(makeLabel('Park file write',4*SC,PY+0.8,0.5,'#888899'));
  // Y park detail
  const ypark=box(1.2,0.3,0.2,C.Y,.5);ypark.position.set(4*SC,PY-1,0);gP2.add(ypark);
  gP2.add(makeLabel('Y park:\n[4B first Y][delta stream]',4*SC,PY-1.5,0.35,'#44ddff'));
  // Arrows
  gP2.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(-3*SC,PY-1.5,0),new T.Vector3(-0.8*SC,PY-1.5,0)]),new T.LineBasicMaterial({color:C.FLOW,transparent:true,opacity:.3})));
  gP2.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(0.8*SC,PY-1.5,0),new T.Vector3(3.2*SC,PY,0)]),new T.LineBasicMaterial({color:C.FLOW,transparent:true,opacity:.3})));
}

// ===== SCENE 7: BINARY TREE =====
const gTree=ng('tree');
const tL=[];
{
  const TW=9*SC;
  for(let k=0;k<=8;k++){const count=1<<k;const y=12*SC-k*1.3*SC;
    const r=(k===0?.12:k===8?.04:.07)*SC;
    const im=new T.InstancedMesh(new T.SphereGeometry(r,8,8),
      new T.MeshStandardMaterial({color:k===0?C.Y:k===8?C.X:C.PD,transparent:true,opacity:.8,roughness:.5}),count);
    const m=new T.Matrix4();
    for(let i=0;i<count;i++)m.makeTranslation(-TW/2+(i+.5)*TW/count,y,0),im.setMatrixAt(i,m);
    im.instanceMatrix.needsUpdate=true;im.visible=false;gTree.add(im);
    tL.push({mesh:im,y,count,level:k});}
  const ev=[];
  for(let k=0;k<8;k++)for(let i=0;i<(1<<k);i++){
    const px=-4.5+(i+.5)*9/(1<<k),py=12-k*1.3;
    const lx=-4.5+(2*i+.5)*9/(1<<(k+1)),ly=12-(k+1)*1.3;
    const rx=-4.5+(2*i+1.5)*9/(1<<(k+1));
    ev.push(px*SC,py*SC,0,lx*SC,ly*SC,0,px*SC,py*SC,0,rx*SC,ly*SC,0);}
  const eg=new T.BufferGeometry();eg.setAttribute('position',new T.BufferAttribute(new Float32Array(ev),3));
  const el=new T.LineSegments(eg,new T.LineBasicMaterial({color:C.EDGE,transparent:true,opacity:.1}));
  el.visible=false;gTree.add(el);gTree.userData.edges=el;
  gTree.add(makeLabel('1 Y match',0,12*SC+0.3,0.4,'#44ddff'));
  gTree.add(makeLabel('256 X values',0,12*SC-8*1.3*SC-0.3,0.4,'#44ff88'));
  gTree.userData.expandLevel=0;gTree.userData.expandTime=0;
}

// ===== SCENE 8: PROOF LOOKUP =====
const gProof=ng('proof');
{
  const FW=10*SC,FH=0.8*SC,FD=0.5*SC;
  const secs=[{n:'Y',w:0.008,c:C.Y},{n:'PD0',w:0.113,c:C.PD},
    {n:'PD1',w:0.113,c:C.PD},{n:'PD2',w:0.113,c:C.PD},{n:'PD3',w:0.113,c:C.PD},
    {n:'PD4',w:0.113,c:C.PD},{n:'PD5',w:0.113,c:C.PD},{n:'PD6',w:0.113,c:C.PD},
    {n:'X',w:0.203,c:C.X}];
  let x=-FW/2;const fb=[];
  for(const s of secs){const w=s.w*FW;if(w<0.02)continue;
    const b=box(w/SC,FH/SC,FD/SC,s.c,.3);b.position.set(x+w/2,6*SC,0);gProof.add(b);
    fb.push({mesh:b,sec:s,x:x+w/2,w});x+=w;}
  gProof.userData.fb=fb;
  gProof.add(makeLabel('1. Scan Y',fb[0].x,7.5*SC,0.4,'#44ddff'));
  gProof.add(makeLabel('2. Walk PD (9 to 2)',fb[4].x,7.5*SC,0.4,'#aa44ff'));
  gProof.add(makeLabel('3. Read X',fb[8].x,7.5*SC,0.4,'#44ff88'));
  gProof.add(makeLabel('256 X values = proof',0,4*SC,0.5,'#44ff88'));
  gProof.userData.timer=0;
}

// ===== PARTICLES =====
class P{constructor(){this.m=new T.Mesh(new T.SphereGeometry(.025*SC,4,4),
  new T.MeshBasicMaterial({color:C.FLOW,transparent:true,opacity:.6}));
  this.m.visible=false;this.active=false;this.t=0;S.add(this.m);}
  fire(f,to,c,sp=.5,ar=.2){this.f=f.clone();this.to=to.clone();this.t=0;this.sp=sp;this.ar=ar;
    this.active=true;this.m.visible=true;this.m.material.color.setHex(c);this.m.material.opacity=.6;}
  upd(dt){if(!this.active)return;this.t+=this.sp*dt;if(this.t>=1){this.active=false;this.m.visible=false;return;}
    const t=this.t;this.m.position.lerpVectors(this.f,this.to,t);
    this.m.position.y+=Math.sin(t*Math.PI)*this.ar*SC;
    this.m.material.opacity=.6*Math.sin(t*Math.PI);}}
const pool=[];for(let i=0;i<40;i++)pool.push(new P());
let pi=0;function spawn(f,to,c,sp,ar){pool[pi].fire(f,to,c,sp,ar);pi=(pi+1)%pool.length;}

// ===== STEPS =====
const steps=[
{name:'Plot File',desc:'14.6 GB: Y table (1%), 7 PD sections (79%), X table (20%)',
 group:'file',cam:{p:[0,3,11],t:[0,3,0]},
 info:{t:'The Plot File',d:'A single binary file proving you spent compute time.',
 body:`<h3>Analogy</h3>
<div class="d">Solve 536M puzzles, write answers in a file. Later, someone challenges you: look up the answer in seconds instead of re-solving.</div>
<h3>Sections</h3>
<div class="s">Header — 4 KB (ksize, seed, plot_id, farmer_key, park sizes, offsets)</div>
<div class="s">Y table — 144 MB (1%) — sorted Y values of table 9, delta-encoded parks</div>
<div class="s">PD[0-6] — 7 × 2 GB (79%) — back-pointers for tables 9→8, 8→7, ..., 3→2</div>
<div class="s">X table — 3.6 GB (20%) — X values of table 2, packed as line points</div>
<div class="k">PD parks are 79% of the file. They store the binary tree back-pointers.</div>
<div class="s">park_size_y=8192, park_size_pd=2048, park_size_x=2048</div>`}},

{name:'F1: Memory-Hard Hash',desc:'X → 4KB memory → 256-iter random access → SHA512 → Y + meta',
 group:'f1',cam:{p:[0,4,10],t:[0,4,0]},
 info:{t:'Table 1: F1 Generation',d:'Memory-hard proof-of-work. Cannot be shortcut.',
 body:`<h3>Per X value (0 to 536M-1):</h3>
<div class="d">1. key = SHA512(X ‖ plot_id)</div>
<div class="d">2. Generate 4KB memory: 32 rounds of hashing → 1024 uint32</div>
<div class="d">3. 256 iterations of random access into that 4KB</div>
<div class="d">4. SHA512(key ‖ mem_hash) → Y (29-bit) + C (14×29-bit meta)</div>
<div class="c">Y = XOR(SHA512(key ‖ mem_hash)[0..13]) &amp; KMASK
C[j*14+i] = hash[i] &amp; KMASK
X[j] = X  (stored for proof)</div>
<div class="s">Cost: 2^29 × 4KB = 2TB writes. ~9.4s on RTX 5090 (compute-bound).</div>
<div class="s">Verification: only 256 X values need F1 recompute = milliseconds.</div>`}},

{name:'Match + Eval',desc:'Find (Y, Y+1) pair → SHA512(meta_L‖meta_R) → new entry + PD back-ptr',
 group:'entry',cam:{p:[0,4,9],t:[0,4,0]},
 info:{t:'Building a Table Entry',d:'The core operation: combine two parents into one child.',
 body:`<div class="k">Each entry in tables 2-9 is created by finding two entries with consecutive Y values.</div>
<h3>Step by step</h3>
<div class="d">1. Sort entries by Y value</div>
<div class="d">2. Find a pair where Y and Y+1 are both present</div>
<div class="d">3. SHA512(meta_L ‖ meta_R) → new Y + new meta</div>
<div class="d">4. Store PD back-pointer to find parents later</div>
<div class="c">block = meta_L ‖ meta_R    // 2×14×29 = 812 bits
hash = SHA512(block)
Y_new = XOR(hash[0..13]) &amp; KMASK
PD = (left_parent_index &lt;&lt; 5) | delta</div>
<h3>PD Encoding</h3>
<div class="s">PD = 40 bits: [position:30 bits][delta:5 bits]</div>
<div class="s">position = y_output × max_bucket_size + global_pos_input</div>
<div class="s">delta = distance from left to right parent</div>
<div class="s">Phase 2 remaps positions to compact indices before park encoding</div>`}},

{name:'Tables 1-9',desc:'9 tables, each ~536M entries. NOT a funnel — sizes barely change.',
 group:'tables',cam:{p:[0,6,14],t:[0,5,0]},
 info:{t:'The 9 Tables',d:'All tables have ~536M entries. They do NOT shrink.',
 body:`<div class="k">All 9 tables are approximately the same size. This is a FOREST of ~536M binary trees.</div>
<h3>Table Types</h3>
<div class="s">T1 (F1): X → memory-hard hash → (Y, C=14×meta). 536.9M entries.</div>
<div class="s">T2: match (Y,Y+1) → SHA512. Stores X2 (actual X values). 536.9M entries.</div>
<div class="s">T3-T8: same match+eval. Store PD back-pointers. ~536.8M each.</div>
<div class="s">T9: final table. Y-sorted, C_out=12×meta (reduced from 14). 536.1M entries.</div>
<h3>Why same size?</h3>
<div class="d">With 536M entries in 536M Y-space, each entry matches ~2 partners (as left AND right). So matches ≈ entries.</div>
<div class="s">T1: 536,870,912 → T9: 536,061,737 (only 0.15% smaller)</div>
<div class="s">Compute: T1=9.6s (F1), T2-T9=28.7s total (DMA-bound)</div>`}},

{name:'GPU Pipeline',desc:'4 streams: upload RAM→GPU, compute, download GPU→RAM. PCIe DMA is the bottleneck.',
 group:'pipe',cam:{p:[0,4,12],t:[0,4,0]},
 info:{t:'GPU Pipeline (Phase 1)',d:'How data flows between CPU RAM and GPU for tables 2-9.',
 body:`<div class="k">4 CUDA streams run in parallel. Each stream processes every 4th bucket.</div>
<h3>Per-bucket pipeline</h3>
<div class="d">1. Upload: RAM bucket → GPU device buffer (PCIe DMA)</div>
<div class="d">2. Compute: GPU kernels (scatter, sort, match, eval)</div>
<div class="d">3. Download: GPU device buffer → RAM bucket (PCIe DMA)</div>
<h3>Streams</h3>
<div class="s">NSTREAMS=4 (sweet spot for RTX 5090)</div>
<div class="s">Stream k processes buckets k, k+4, k+8, ...</div>
<div class="s">Upload/download threads run concurrently with compute</div>
<h3>Memory</h3>
<div class="s">RAM: host buckets (non-pinned, chunked). ~30 GB total.</div>
<div class="s">GPU: device buffers (pinned DMA). Reused per bucket.</div>
<div class="s">Disk: only phase 2 writes to disk. Phase 1 is pure RAM↔GPU.</div>
<div class="k">DMA is the bottleneck: ~488 GB transfers at PCIe4 32 GB/s = 15.3s floor.</div>
<div class="s">Measured: 28.7s for tables 2-9 (89% pipeline efficiency)</div>`}},

{name:'Phase 2: Park Encoding',desc:'Two passes: mark_used+remap (compact), then sort+delta-encode → park file.',
 group:'p2',cam:{p:[0,5,11],t:[0,4,0]},
 info:{t:'Phase 2: Park Encoding',d:'Convert raw RAM buckets to compressed park format, write to disk.',
 body:`<div class="k">Phase 2 has TWO passes per table. It remaps positions to compact indices, then encodes parks.</div>
<h3>Pass 1: Compaction</h3>
<div class="d">1. mark_used: build bitfield of which positions are referenced</div>
<div class="d">2. count_used: count set bits per group</div>
<div class="d">3. remap_pd: replace sparse positions with dense compact indices</div>
<div class="s">Raw PD: position = y × max_bucket_size + global_pos (sparse, 30-bit)</div>
<div class="s">Compact PD: position = sequential index (dense, 29-bit, no gaps)</div>
<h3>Pass 2: Encoding</h3>
<div class="d">1. Sort entries by Y (within bucket)</div>
<div class="d">2. Delta-encode: store first value, then differences</div>
<div class="d">3. ANS-encode deltas into compact bit stream</div>
<div class="d">4. Write park to file: [first value][delta bit stream]</div>
<h3>Park Types</h3>
<div class="s">Y park: [4B first Y][8191 deltas @ ~2.25 bits each] ≈ 2308 bytes</div>
<div class="s">PD park: [2048×29-bit positions][delta stream @ ~2.65 bits] ≈ 8103 bytes</div>
<div class="s">X park: [2048×57-bit line points] ≈ 14592 bytes</div>
<div class="k">Phase 2 time: ~5-7s. Writes 14.6 GB to disk.</div>`}},

{name:'Proof = Binary Tree',desc:'1 root at T9 → 2→4→...→256 leaves. Perfect depth-8 binary tree.',
 group:'tree',cam:{p:[0,7,16],t:[0,6,0]},
 info:{t:'Proof Structure',d:'A proof is a binary tree walk: from 1 root to 256 X value leaves.',
 body:`<div class="k">Every proof is a perfect binary tree of depth 8. One root, 256 leaves.</div>
<h3>The Walk</h3>
<div class="s">Table 9 → 1 entry (root, the Y match)</div>
<div class="s">Table 8 → 2 entries (root's parents)</div>
<div class="s">Table 7 → 4 entries</div>
<div class="s">...doubling each level...</div>
<div class="s">Table 2 → 128 entries, each has 2 X values</div>
<div class="s">Table 1 → 256 X values (leaves)</div>
<div class="c">pointers = [root_index]      // 1 entry
for t in 9→2:               // 7 steps
  new = []
  for idx in pointers:         // doubles
    PD = read_park(t, idx)
    left  = PD >> 5            // parent 1
    right = left + (PD & 31) + 1
    new += [left, right]
  pointers = new               // 2x each step
// 128 pointers → read X park → 256 X values</div>
<div class="s">Proof = 256 uint32 X values ≈ 1 KB</div>
<div class="k">The plot file stores back-pointers for ALL 536M trees. That is why PD is 79% of the file.</div>`}},

{name:'Proof Lookup',desc:'Scan Y → walk PD parks → read X park → 256 X values. Milliseconds.',
 group:'proof',cam:{p:[0,6,13],t:[0,5,0]},
 info:{t:'Proof Lookup (Farming)',d:'How the file is read to answer a challenge.',
 body:`<div class="k">Farming = reading the file to find proofs. Three steps, all fast.</div>
<h3>Step 1: Scan Y table</h3>
<div class="d">challenge → Y_begin = SHA256("plot_challenge"‖plot_id‖challenge) &amp; KMASK</div>
<div class="d">Scan Y parks for entries in [Y_begin, Y_begin+16)</div>
<div class="s">Y is sorted → binary search. Each hit = 1 tree root.</div>
<h3>Step 2: Walk PD parks</h3>
<div class="d">For each Y match, read PD parks from table 9 down to table 2:</div>
<div class="s">PD[0]: T9→T8 → 2 pointers (read compact position + delta)</div>
<div class="s">PD[1]: T8→T7 → 4 pointers</div>
<div class="s">...7 parks, doubling each time...</div>
<div class="s">PD[6]: T3→T2 → 128 pointers</div>
<h3>Step 3: Read X park</h3>
<div class="d">128 table-2 indices → read X park → 256 X values</div>
<div class="s">X park stores line points: 57 bits each → split into (X1, X2)</div>
<h3>The asymmetry</h3>
<div class="k">Lookup = O(parks read) = milliseconds. Plotting = O(536M) = 42 seconds.</div>
<div class="s">Verification: recompute tree from 256 X values → 1 Y. O(256) = milliseconds.</div>`}},
];

let cur=0,playing=true,stTimer=0,stDur=9,speed=1;
const dts=document.getElementById('dts');
for(let i=0;i<steps.length;i++){const d=document.createElement('div');dts.appendChild(d);}
function showStep(i){
  cur=i;const s=steps[i];
  Object.values(G).forEach(g=>g.visible=false);
  if(s.group&&G[s.group])G[s.group].visible=true;
  document.getElementById('sn').textContent=s.name;
  document.getElementById('sd').textContent=s.desc;
  document.getElementById('info').innerHTML=`<h2>${s.info.t}</h2><div class="d">${s.info.d}</div>${s.info.body}`;
  const ds=dts.children;for(let j=0;j<ds.length;j++)ds[j].className=j===i?'on':j<i?'done':'';
  camT={p:new T.Vector3(...s.cam.p),t:new T.Vector3(...s.cam.t),f:0};stTimer=0;
  if(s.group==='tree'){gTree.userData.expandLevel=0;gTree.userData.expandTime=0;
    tL.forEach(l=>l.mesh.visible=false);gTree.userData.edges.visible=false;}
  if(s.group==='file')gFile.userData.boxes.forEach(b=>{b.mesh.material.opacity=.2;b.mesh.material.emissiveIntensity=0;});
  if(s.group==='proof'){gProof.userData.timer=0;gProof.userData.fb.forEach(b=>{b.mesh.material.opacity=.3;b.mesh.material.emissiveIntensity=0;});}
  if(s.group==='tables')gTables.userData.layers.forEach(l=>{l.mesh.material.opacity=.2;l.mesh.material.emissiveIntensity=0;});
}
let camT={p:cam.position.clone(),t:ctr.target.clone(),f:1};
document.getElementById('bp').onclick=()=>showStep((cur-1+steps.length)%steps.length);
document.getElementById('bn').onclick=()=>showStep((cur+1)%steps.length);
document.getElementById('bpl').onclick=()=>{playing=!playing;document.getElementById('bpl').textContent=playing?'Pause':'Auto';document.getElementById('bpl').classList.toggle('on',playing);};
document.getElementById('br').onclick=()=>{showStep(0);playing=false;document.getElementById('bpl').textContent='Auto';document.getElementById('bpl').classList.remove('on');};
document.getElementById('spv').oninput=e=>{speed=parseFloat(e.target.value);document.getElementById('spvl').textContent=speed.toFixed(1)+'x';};

const cl=new T.Clock();let time=0,fT=0,bT=0,tT=0,trT=0,pT=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(cl.getDelta(),.05)*speed;if(playing)time+=dt;
  if(camT.f<1){camT.f=Math.min(1,camT.f+dt*2);const f=camT.f*camT.f*(3-2*camT.f);
    cam.position.lerp(camT.p,f*.05);ctr.target.lerp(camT.t,f*.05);}
  if(playing){stTimer+=dt;if(stTimer>=stDur)showStep((cur+1)%steps.length);}

  if(G.file.visible){fT+=dt;const boxes=gFile.userData.boxes;const shown=Math.floor(fT/0.6);
    boxes.forEach((b,i)=>{if(i<shown){b.mesh.material.opacity=.85;b.mesh.material.emissiveIntensity=.1;}else{b.mesh.material.opacity=.15;b.mesh.material.emissiveIntensity=0;}});}

  if(G.f1.visible){const mg=gF1.userData.memMesh,N=mg.userData.N,sz=mg.userData.sz;
    if(Math.random()<.3){const i1=Math.floor(Math.random()*N),j1=Math.floor(Math.random()*N);
      const i2=Math.floor(Math.random()*N),j2=Math.floor(Math.random()*N);
      spawn(new T.Vector3((i1-N/2)*sz*1.3,4*SC,(j1-N/2)*sz*1.3),new T.Vector3((i2-N/2)*sz*1.3,4*SC,(j2-N/2)*sz*1.3),0xff6688,2,.1);}
    if(Math.random()<.1)spawn(new T.Vector3(-3.5*SC,4*SC,0),new T.Vector3(0,4*SC,0),C.X,.8,.2);
    if(Math.random()<.1)spawn(new T.Vector3(0,4*SC,0),new T.Vector3(3.5*SC,4*SC,0),C.Y,.8,.2);
    mg.material.opacity=.25+Math.sin(time*2)*.08;mg.rotation.y+=dt*.2;}

  if(G.entry.visible){bT+=dt;if(bT>0.3){bT=0;
    spawn(new T.Vector3(-2.5*SC,3.8*SC,0),new T.Vector3(-1*SC,3.8*SC,0),C.META,.8,.2);
    spawn(new T.Vector3(-2.5*SC,3.2*SC,0),new T.Vector3(-1*SC,3.2*SC,0),C.META,.8,.2);
    if(Math.random()<.5)spawn(new T.Vector3(-1*SC,3.5*SC,0),new T.Vector3(0.2*SC,3.5*SC,0),C.Y,.8,.2);}}

  if(G.tables.visible){tT+=dt;const layers=gTables.userData.layers;const shown=Math.floor(tT/0.4);
    layers.forEach((l,i)=>{if(i<=shown){l.mesh.material.opacity=.7;l.mesh.material.emissiveIntensity=i===shown?.2:.05;}else{l.mesh.material.opacity=.15;}});
    if(Math.random()<.08){const i=Math.floor(Math.random()*8);const y1=1.3*SC+i*1.1*SC+0.2,y2=1.3*SC+(i+1)*1.1*SC-0.2;
      spawn(new T.Vector3(0,y1,0),new T.Vector3(0,y2,0),i===0?C.F1:i===8?C.Y:C.PD,.6,.2);}}

  if(G.pipe.visible){
    if(Math.random()<.2){const s=Math.floor(Math.random()*4);const sy=4*SC-0.8+s*0.5;
      spawn(new T.Vector3(-3.5*SC,sy,0),new T.Vector3(3.5*SC,sy,0),C.STREAM,.8,.1);}
    if(Math.random()<.15){const s=Math.floor(Math.random()*4);const sy=4*SC-0.8+s*0.5;
      spawn(new T.Vector3(3.5*SC,sy,0.3),new T.Vector3(-3.5*SC,sy,0.3),C.PD,.8,.1);}}

  if(G.p2.visible){
    if(Math.random()<.15)spawn(new T.Vector3(-4*SC,4*SC,0),new T.Vector3(0,4*SC,0),C.PD,.6,.2);
    if(Math.random()<.15)spawn(new T.Vector3(0,4*SC,0),new T.Vector3(4*SC,4*SC,0),C.Y,.6,.2);
    if(Math.random()<.1)spawn(new T.Vector3(4*SC,4*SC,0),new T.Vector3(4*SC,2*SC,0),C.HDR,.6,.2);}

  if(G.tree.visible){trT+=dt;const lvl=Math.floor(trT/0.4);
    if(lvl>gTree.userData.expandLevel&&lvl<=8){gTree.userData.expandLevel=lvl;
      if(lvl<=8&&tL[lvl]){tL[lvl].mesh.visible=true;if(lvl>0)tL[lvl-1].mesh.material.opacity=.4;}
      if(lvl>=1)gTree.userData.edges.visible=true;}
    if(gTree.userData.expandLevel<=8){const cl=tL[gTree.userData.expandLevel];
      if(cl&&cl.mesh.visible)cl.mesh.material.opacity=.5+Math.sin(time*5)*.3;}
    if(Math.random()<.2){const k=Math.floor(Math.random()*8);const count=1<<k;
      const x=(-4.5+(Math.floor(Math.random()*count)+.5)*9/count)*SC;
      const y1=(12-k*1.3)*SC,y2=(12-(k+1)*1.3)*SC;
      spawn(new T.Vector3(x,y1,0),new T.Vector3(x,y2,0),k===0?C.Y:C.PD,.8,.1);}}

  if(G.proof.visible){pT+=dt;const fb=gProof.userData.fb;const phase=Math.floor(pT/1.0);
    fb.forEach((b,i)=>{b.mesh.material.opacity=.3;b.mesh.material.emissiveIntensity=0;});
    if(phase===0){fb[0].mesh.material.opacity=.9;fb[0].mesh.material.emissiveIntensity=.3;
      if(Math.random()<.2)spawn(new T.Vector3(fb[0].x,6*SC,0),new T.Vector3(fb[0].x,4.5*SC,0),C.Y,.5,.2);}
    else if(phase>=1&&phase<=7){fb[phase].mesh.material.opacity=.9;fb[phase].mesh.material.emissiveIntensity=.3;
      if(Math.random()<.2){const prev=phase>1?fb[phase-1].x:fb[0].x;
        spawn(new T.Vector3(prev,6*SC,0),new T.Vector3(fb[phase].x,6*SC,0),C.PD,.8,.1);}}
    else if(phase>=8){fb[8].mesh.material.opacity=.9;fb[8].mesh.material.emissiveIntensity=.3;
      if(Math.random()<.2)spawn(new T.Vector3(fb[8].x,6*SC,0),new T.Vector3(fb[8].x,4.5*SC,0),C.X,.5,.2);}
    if(phase>10)pT=0;}

  pool.forEach(p=>p.upd(dt));ctr.update();R.render(S,cam);
}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
showStep(0);animate();
</script>
</body>
</html>
