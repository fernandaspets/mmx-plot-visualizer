<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MMX PoSpace Plot — Reference Spec</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="bar">
  <div class="t">MMX PoSpace Plot — Reference Spec (k=29)</div>
  <div class="b">
    <button class="btn" id="bp">◀ Prev</button>
    <button class="btn on" id="bpl">▶ Auto</button>
    <button class="btn" id="bn">Next ▶</button>
    <button class="btn" id="br">↻ Reset</button>
  </div>
</div>

<div id="view"></div>
<div class="step-nav" id="nav"></div>
<div id="progress" style="position:fixed;left:0;top:0;height:2px;background:#20b898;width:0;transition:width .3s"></div>
<div class="info" id="info"></div>

<script type="module">
import { SceneManager } from './js/scene-manager.js';

// Import all scenes
import { scene as s00 } from './js/scenes/00-map.js';
import { scene as s01 } from './js/scenes/01-plot-file.js';
import { scene as s02 } from './js/scenes/02-f1.js';
import { scene as s03 } from './js/scenes/03-match-eval.js';
import { scene as s04 } from './js/scenes/04-tables.js';
import { scene as s05 } from './js/scenes/05-bucketing.js';
import { scene as s06 } from './js/scenes/06-gpu-pipeline.js';
import { scene as s07 } from './js/scenes/07-phase2-remap.js';
import { scene as s08 } from './js/scenes/08-phase2-parks.js';
import { scene as s09 } from './js/scenes/09-binary-tree.js';
import { scene as s10 } from './js/scenes/10-proof-lookup.js';
import { scene as s11 } from './js/scenes/11-verification.js';
import { scene as s12 } from './js/scenes/12-vram-mode.js';
import { scene as s13 } from './js/scenes/13-proof-anatomy.js';
import { scene as s14 } from './js/scenes/14-hash-chain.js';
import { scene as s15 } from './js/scenes/15-playground.js';
import { scene as s16 } from './js/scenes/16-real-verify.js';

const scenes = [s00, s01, s02, s03, s04, s05, s06, s07, s08, s09, s10, s11, s12, s13, s14, s15, s16];

const manager = new SceneManager(
  scenes,
  document.getElementById('view'),
  document.getElementById('info'),
  document.getElementById('nav')
);
</script>
</body>
</html>
